<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los Sorteos · Mariposita</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="header">
        <nav class="nav">
            <a href="/" class="logo">Mariposita<span>.</span></a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/productos.html">Productos</a>
                <a href="/sorteos.html">Sorteos</a>
                <a href="#">Blog</a>
                <div class="header-search">
                    <input type="text" id="input-dni" placeholder="Buscar por DNI o Teléfono..." onkeypress="if(event.key === 'Enter') buscarPedidoPublico()">
                    <button onclick="buscarPedidoPublico()">🔍 Consultar</button>
                </div>
            </div>
            <div class="nav-actions">
                <button class="carrito-btn" onclick="location.href='/carrito.html'">
                    🛒 Carrito (<span id="carrito-count">0</span>)
                </button>
            </div>
        </nav>
    </header>

    <div class="page-header">
        <h1>Nuestros Sorteos</h1>
        <p>Participa y gana hermosas prendas bordadas a mano.</p>
    </div>

    <div class="grid-sorteos" id="grid-sorteos">
        <!-- JS carga los sorteos aquí -->
    </div>

    <footer class="footer">
        <p>© 2026 Artesanía Mariposita | Hecho con ❤️ en Huancavelica</p>
    </footer>

    <!-- MODAL DE BÚSQUEDA (Opcional, para que funcione el buscador desde aquí) -->
    <div class="resultado-overlay" id="resultado-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(3,19,29,0.9);z-index:3000;display:none;justify-content:center;align-items:center;">
        <div style="background:#112240;border:2px solid var(--accent-cyan);border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;padding:2rem;position:relative;">
            <button style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;" onclick="document.getElementById('resultado-overlay').style.display='none'">✕</button>
            <h2 style="color:#fff;margin-bottom:1rem;">Resultados</h2>
            <div id="resultado-body" style="color:#ccc;"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        async function cargarSorteos() {
            try {
                const res = await fetch('/api/sorteos');
                const sorteos = await res.json();
                const grid = document.getElementById('grid-sorteos');
                
                if (!sorteos.length) {
                    grid.innerHTML = '<p style="color:#fff; text-align:center; grid-column: 1/-1;">Pronto anunciaremos nuevos sorteos.</p>';
                    return;
                }

                grid.innerHTML = sorteos.map(s => {
                    const fechaSorteo = new Date(`${s.fecha_sorteo}T23:59:59`).getTime();
                    const yaFinalizo = new Date().getTime() > fechaSorteo;
                    
                    const boton = yaFinalizo 
                        ? `<div class="btn-finalizado">Sorteo Finalizado</div>`
                        : `<a href="/sorteo.html?id=${s.id}" class="btn-comprar">Comprar Ticket</a>`;

                    return `
                        <div class="card-sorteo">
                            <img src="${s.imagen_base64 ? s.imagen_base64 : 'https://via.placeholder.com/300x250/112240/00d2ff?text=' + encodeURIComponent(s.nombre)}" alt="${s.nombre}">
                            <div class="info">
                                <h3>${s.nombre}</h3>
                                <p>${s.descripcion || ''}</p>
                                <div class="fecha">📅 Sorteo: ${s.fecha_sorteo}</div>
                                <div class="precio">S/ ${s.precio_ticket.toFixed(2)}</div>
                                ${boton}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error al cargar sorteos:", error);
            }
        }

        // (Opcional) Lógica simple para el buscador en esta página
        async function buscarPedidoPublico() {
            const query = document.getElementById('input-dni').value.trim();
            if (!query) return alert("Ingresa un DNI o Teléfono");
            const overlay = document.getElementById('resultado-overlay');
            const body = document.getElementById('resultado-body');
            overlay.style.display = 'flex';
            body.innerHTML = 'Buscando...';
            try {
                const res = await fetch(`/api/consultar?query=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (!data.ordenes.length && !data.tickets.length) {
                    body.innerHTML = '<p>No se encontraron resultados.</p>';
                    return;
                }
                let html = '';
                data.tickets.forEach(t => {
                    html += `<div style="background:#0d253f;padding:1rem;border-radius:8px;margin-bottom:0.5rem;border-left:4px solid var(--accent-cyan);">
                        <p><strong>Ticket: ${t.numero_ticket}</strong> (${t.estado_pago})</p>
                        <p>Sorteo: ${t.sorteo_nombre}</p>
                        <p>Participante: ${t.cliente_nombre}</p>
                    </div>`;
                });
                body.innerHTML = html;
            } catch (e) { body.innerHTML = 'Error al buscar.'; }
        }

        function actualizarContador() {
            const carrito = JSON.parse(localStorage.getItem('carrito') || '[]');
            const total = carrito.reduce((s, i) => s + i.cantidad, 0);
            document.getElementById('carrito-count').textContent = total;
        }

        cargarSorteos();
        actualizarContador();
    </script>
</body>
</html>
