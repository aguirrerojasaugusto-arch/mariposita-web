<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanía Mariposita | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    
    <style>
        /* --- BLOQUEO DE SCROLL --- */
        body.no-scroll { overflow: hidden; }

        /* --- CORRECCIÓN DEL LOGO EN EL HEADER --- */
        .logo-img-dinamico { width: 45px !important; height: 45px !important; object-fit: cover !important; border-radius: 50%; background: #fff; margin-right: 10px; display: block; }
        .logo-block { display: flex; align-items: center; height: 70px; overflow: hidden; }

        /* --- HEADER Y BUSCADOR --- */
        .header-search { display: flex; align-items: center; background: #0d253f; border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 20px; padding: 0.2rem 0.5rem; margin-left: 1rem; flex-grow: 1; max-width: 350px; }
        .header-search input { background: transparent; border: none; color: #fff; padding: 0.4rem 0.8rem; font-size: 0.85rem; outline: none; width: 100%; }
        .header-search input::placeholder { color: #8892b0; }
        .header-search button { background: var(--accent-cyan); color: #03131d; border: none; padding: 0.4rem 0.8rem; border-radius: 15px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: opacity 0.3s; white-space: nowrap; }
        .header-search button:hover { opacity: 0.8; }

        /* --- HERO CON FONDO DINÁMICO --- */
        .hero-nuevo { background: #03131d; padding: 4rem 5%; position: relative; display: flex; justify-content: flex-start; align-items: center; min-height: 500px; overflow: hidden; }
        .hero-bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hero-bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .hero-bg-slide.active { opacity: 1; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(3, 19, 29, 0.85) 0%, rgba(3, 19, 29, 0.1) 100%); z-index: 2; }
        .hero-nuevo-container { position: relative; z-index: 3; display: flex; align-items: stretch; background: rgba(17, 34, 64, 0.85); backdrop-filter: blur(12px); border: 2px solid var(--accent-cyan); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); max-width: 480px; width: 100%; height: 220px; padding: 1.2rem; gap: 1rem; overflow: hidden; }
        .hero-imagen-container { flex: 0 0 150px; height: 100%; border-radius: 8px; overflow: hidden; background: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .hero-imagen-container img { width: 100%; height: 100%; object-fit: cover; }
        .hero-info { flex: 1; color: #fff; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .hero-titulo-fijo { font-size: 2.2rem; line-height: 1.2; height: 5.2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 0.5rem; }
        .hero-desc-fija { font-size: 1rem; color: #ccc; height: 3rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 0; }

        /* --- ESTILOS DEL CATÁLOGO --- */
        .search-container { display: flex; justify-content: center; margin-bottom: 2rem; }
        .search-container input { width: 100%; max-width: 500px; padding: 1rem 1.5rem; border-radius: 30px; border: 2px solid rgba(0, 210, 255, 0.3); background: #112240; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        .search-container input:focus { border-color: var(--accent-cyan); }
        .productos-carousel-container { position: relative; display: flex; align-items: center; gap: 1rem; padding: 0 5%; max-width: 1200px; margin: 0 auto; justify-content: center; }
        .productos-viewport { overflow: hidden; width: 100%; max-width: 904px; border-radius: 8px; }
        .productos-track { display: flex; gap: 2rem; transition: transform 0.4s ease-in-out; }
        .card-producto { width: 280px; min-width: 280px; flex-shrink: 0; background-color: #0d253f; border-radius: 8px; overflow: hidden; transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .card-producto:hover { border-color: var(--accent-cyan); transform: translateY(-3px); }
        .card-producto img { width: 100%; height: 200px; object-fit: cover; object-position: center; }
        .card-producto .info { padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-producto h3 { color: #fff; font-size: 1.1rem; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-producto p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; flex-grow: 1; height: 2.5rem; overflow: hidden; }
        .card-producto .precio { color: var(--accent-cyan); font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card-producto .stock { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1rem; }
        .card-producto .btn-primario { width: 100%; padding: 0.6rem; background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: 600; cursor: pointer; transition: all 0.3s; border-radius: 4px; }
        .card-producto .btn-primario:hover { background: var(--accent-cyan); color: var(--bg-dark); }
        .prod-nav-btn { background: #0d253f; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; z-index: 10; display: flex; justify-content: center; align-items: center; transition: all 0.3s; flex-shrink: 0; }
        .prod-nav-btn:hover { background: var(--accent-cyan); color: #03131d; }
        .prod-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; color: #555; background: transparent; }

        /* --- BOTÓN FLOTANTE DE WHATSAPP --- */
        .whatsapp-float { position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px; background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center; font-size: 35px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3); z-index: 10000; display: flex; align-items: center; justify-content: center; text-decoration: none; animation: rotateWhatsApp 4s linear infinite; transition: transform 0.3s; }
        .whatsapp-float:hover { background-color: #128C7E; transform: scale(1.1); }
        @keyframes rotateWhatsApp { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }
        @media (max-width: 768px) { .whatsapp-float { width: 50px; height: 50px; bottom: 20px; right: 20px; font-size: 28px; } }

        /* --- MODALES (SORTEOS Y TICKETS) --- */
        .resultado-overlay, .sorteos-modal, .ticket-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 19, 29, 0.9); backdrop-filter: blur(8px); z-index: 4000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .resultado-overlay.active, .sorteos-modal.active, .ticket-modal.active { display: flex; opacity: 1; }
        .resultado-content, .sorteos-content, .ticket-content { background: #112240; border-radius: 12px; border: 1px solid var(--accent-cyan); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; position: relative; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .resultado-content { width: 90%; max-width: 700px; max-height: 85vh; }
        .resultado-header, .sorteos-header, .ticket-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: #1a365d; }
        .resultado-header h2, .sorteos-header h2, .ticket-header h2 { color: #fff; margin: 0; font-size: 1.5rem; }
        .resultado-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .resultado-body, .sorteos-body, .ticket-body { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* Sorteos */
        .sorteos-content { width: 100%; max-width: 660px; max-height: 85vh; }
        .sorteos-carrusel-wrapper { display: flex; align-items: center; gap: 0.5rem; }
        .sorteos-viewport { overflow: hidden; width: 100%; }
        .sorteos-track { display: flex; gap: 1.2rem; transition: transform 0.4s; }
        .card-sorteo-carrusel { background: #0d253f; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; width: 280px; min-width: 280px; flex-shrink: 0; }
        .card-sorteo-carrusel img { width: 100%; height: 150px; object-fit: cover; }
        .card-sorteo-carrusel .info { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-sorteo-carrusel h3 { font-size: 1rem; color: #fff; margin: 0 0 0.3rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sorteo-carrusel .precio { color: #ffcc00; font-size: 1.1rem; font-weight: 800; margin-bottom: 0.8rem; }
        .card-sorteo-carrusel .btn-comprar { width: 100%; padding: 0.6rem; background: var(--accent-cyan); color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .card-sorteo-carrusel .btn-finalizado { width: 100%; padding: 0.6rem; background: #555; color: #ccc; border-radius: 6px; text-align: center; font-weight: bold; }
        .carousel-btn { background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .carousel-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Ticket Form */
        .ticket-content { width: 95%; max-width: 450px; max-height: 90vh; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.3rem; color: #ccc; }
        .input-wrapper { display: flex; background: #f4f4f4; border-radius: 8px; overflow: hidden; }
        .input-wrapper.dark { background: rgba(20, 5, 40, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); }
        .input-icon { width: 45px; display: flex; justify-content: center; align-items: center; background: #7b2cbf; color: #fff; font-size: 1.1rem; }
        .input-wrapper input, .input-wrapper select { flex: 1; padding: 0.8rem; border: none; background: transparent; font-size: 0.95rem; color: #333; outline: none; width: 100%; }
        .input-wrapper.dark input, .input-wrapper.dark select { color: #fff; }
        .input-wrapper.dark select option { background: #112240; color: #fff; }
        .input-wrapper input:disabled { background-color: #e9ecef !important; color: #6c757d !important; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .total-box { display: flex; align-items: center; background: #100520; border: 2px solid #ffcc00; border-radius: 8px; padding: 0.3rem; height: 46px; }
        .total-amount { flex: 1; text-align: right; font-size: 1.2rem; font-weight: 800; color: #ffcc00; padding-right: 8px; }
        .pago-box { background: rgba(255, 204, 0, 0.05); border: 1px dashed #ffcc00; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; text-align: center; font-size: 0.85rem; }
        .pago-box h4 { color: #ffcc00; margin: 0 0 0.5rem 0; text-transform: uppercase; font-size: 0.8rem; }
        .pago-box .pago-numero { font-size: 1.2rem; font-weight: 800; color: #ffcc00; display: block; }
        .upload-zone { border: 2px dashed rgba(255, 204, 0, 0.4); background: rgba(255, 204, 0, 0.05); border-radius: 8px; padding: 1rem; text-align: center; position: relative; cursor: pointer; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .upload-title { color: #ffcc00; font-weight: 800; font-size: 0.9rem; }
        .btn-submit { width: 100%; padding: 0.9rem; background: #ffcc00; color: #000; border: none; border-radius: 8px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        /* ⭐ ANIMACIÓN DE CARGA (SPINNER) */
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.3); border-radius: 50%; border-top-color: #000; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-submit:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }
        .btn-submit:disabled .spinner { border-top-color: #888; }

        /* ⭐ NUEVOS ESTILOS PARA PROGRESO DE VALIDACIÓN */
        .progress-container { display: none; margin-top: 1rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,204,0,0.3); }
        .progress-step { font-size: 0.85rem; color: #8892b0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; opacity: 0.4; transition: all 0.3s; }
        .progress-step.active { color: #ffcc00; font-weight: bold; opacity: 1; }
        .progress-step.done { color: #25d366; opacity: 1; }
        .spinner-small { width: 14px; height: 14px; border: 2px solid rgba(255, 204, 0, 0.2); border-top-color: #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; }
        .progress-step.done .spinner-small { display: none; }

        /* ⭐ ESTILOS DEL TICKET DE ÉXITO */
        .success-ticket-wrapper { text-align: center; padding: 1rem; color: #fff; }
        .success-header { display: flex; align-items: center; gap: 10px; background: rgba(37, 211, 102, 0.1); border: 1px solid rgba(37, 211, 102, 0.3); padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
        .success-header-icon { background: #25d366; color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .success-header-text h3 { margin: 0; color: #25d366; font-size: 1rem; }
        .success-header-text p { margin: 0; font-size: 0.8rem; color: #ccc; }
        .purple-ticket-card { background: linear-gradient(135deg, #6a0dad 0%, #9b30ff 100%); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(106, 13, 173, 0.4); margin-bottom: 20px; }
        .purple-ticket-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px; opacity: 0.5; }
        .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 2; margin-bottom: 15px; }
        .premios-logo { background: #000; color: #ffcc00; padding: 5px 10px; border-radius: 6px; font-weight: 900; font-size: 0.7rem; display: flex; align-items: center; gap: 5px; }
        .status-badge { background: #000; color: #25d366; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; border: 1px solid #25d366; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; background: #25d366; border-radius: 50%; }
        .ticket-number-box { background: rgba(0, 0, 0, 0.3); border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 15px; text-align: center; position: relative; z-index: 2; margin-bottom: 15px; }
        .ticket-number-box p { margin: 0; font-size: 0.75rem; letter-spacing: 2px; color: rgba(255,255,255,0.7); text-transform: uppercase; }
        .ticket-number-box h1 { margin: 5px 0 0 0; font-size: 2.5rem; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .ticket-details-row { display: flex; justify-content: space-between; position: relative; z-index: 2; border-top: 1px dashed rgba(255,255,255,0.3); padding-top: 15px; text-align: left; }
        .ticket-detail-item { display: flex; flex-direction: column; gap: 3px; }
        .ticket-detail-item span { font-size: 0.65rem; color: rgba(255,255,255,0.7); text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
        .ticket-detail-item strong { font-size: 0.85rem; color: #fff; }
        .btn-ver-tickets { background: #ffcc00; color: #000; width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; transition: transform 0.2s; }
        .btn-ver-tickets:hover { transform: scale(1.02); }
        .btn-ver-tickets svg { width: 20px; height: 20px; }
        .security-text { display: flex; align-items: center; justify-content: center; gap: 8px; color: #25d366; font-size: 0.8rem; font-weight: 600; }

        /* --- CARRITO FLOTANTE --- */
        .carrito-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .carrito-overlay.active { opacity: 1; visibility: visible; }
        .carrito-sidebar { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100%; background-color: #0d253f; z-index: 1001; box-shadow: -5px 0 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; transition: right 0.4s ease-in-out; }
        .carrito-sidebar.active { right: 0; }
        .carrito-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .carrito-header h3 { color: #fff; font-size: 1.2rem; margin: 0; }
        .btn-cerrar { background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .carrito-items { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .carrito-item { display: flex; align-items: center; gap: 1rem; background: #112240; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .carrito-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
        .carrito-item .item-info { flex: 1; }
        .carrito-item .item-info h4 { color: #fff; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .carrito-item .item-info p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
        .carrito-item .item-controls { display: flex; align-items: center; gap: 0.5rem; background: #0b1b2b; border-radius: 4px; width: fit-content; padding: 2px; }
        .carrito-item .item-controls button { background: transparent; border: none; color: #fff; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }
        .carrito-item .item-controls span { color: #fff; font-size: 0.9rem; min-width: 15px; text-align: center; }
        .btn-eliminar { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; }
        .carrito-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); background-color: #0b1b2b; }
        .carrito-total { display: flex; justify-content: space-between; color: #fff; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; }

        /* Toast */
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent-cyan); color: #03131d; padding: 1rem 1.5rem; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; transform: translateY(20px); transition: all 0.3s; z-index: 9999; font-weight: 600; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="top-bar">
            <div class="top-bar-info"><span>📞 (0125) 456 78 90</span><span>✉️ ventas@mariposita.pe</span><span>📍 Huancavelica, Perú</span></div>
        </div>
        <div class="header-wrap">
            <div class="header">
                <a href="/" class="logo-block">
                    <div class="logo-icon" id="logo-header">🦋</div>
                    <div class="logo-text"><strong>MARIPOSITA</strong><span>Artesanía Textil</span></div>
                </a>
                <nav class="nav-links">
                    <a href="/">Inicio</a><a href="#productos">Productos</a><a href="javascript:void(0)" onclick="abrirModalSorteos()">Sorteos</a>
                    <div class="header-search">
                        <input type="text" id="input-dni" placeholder="Buscar por DNI o Nº telefono..." onkeypress="if(event.key === 'Enter') buscarPedidoPublico()">
                        <button onclick="buscarPedidoPublico()">🔍 Mis Tickets</button>
                    </div>
                </nav>
                <div class="nav-actions">
                    <button class="btn-outline" onclick="toggleCarrito()" style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section class="hero-nuevo" id="hero-carrusel">
        <div class="hero-bg-container" id="hero-bg-container"></div>
        <div class="hero-overlay"></div>
        <div class="hero-nuevo-container">
            <div class="hero-imagen-container" id="hero-imagen-container"></div>
            <div class="hero-info" id="hero-info"></div>
        </div>
    </section>

    <section class="section" id="productos">
        <h2 class="section-title">Nuestro Catálogo</h2>
        
        <div class="search-container">
            <input type="text" id="buscador-productos" placeholder="🔍 Buscar producto por nombre o categoría..." onkeyup="filtrarYRenderizar()">
        </div>

        <div class="productos-carousel-container">
            <button class="prod-nav-btn" id="btn-prev-prod" onclick="moverProductos(-1)">&#10094;</button>
            <div class="productos-viewport">
                <div class="productos-track" id="grid-productos"></div>
            </div>
            <button class="prod-nav-btn" id="btn-next-prod" onclick="moverProductos(1)">&#10095;</button>
        </div>
    </section>

    <!-- BOTÓN FLOTANTE DE WHATSAPP -->
    <a href="#" id="btn-whatsapp" class="whatsapp-float" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
    </a>

    <div class="resultado-overlay" id="resultado-overlay">
        <div class="resultado-content">
            <div class="resultado-header"><h2>Resultados</h2><button class="resultado-close" onclick="cerrarResultado()">✕</button></div>
            <div class="resultado-body" id="resultado-body"></div>
        </div>
    </div>

    <div class="sorteos-modal" id="sorteos-modal">
        <div class="sorteos-content">
            <div class="sorteos-header"><h2>🎁 Nuestros Sorteos Activos</h2><button class="resultado-close" onclick="cerrarModalSorteos()">✕</button></div>
            <div class="sorteos-body">
                <div class="sorteos-carrusel-wrapper">
                    <button class="carousel-btn" id="btn-prev-sorteo" onclick="moverSorteosModal(-1)">&#10094;</button>
                    <div class="sorteos-viewport">
                        <div class="sorteos-track" id="sorteos-track"></div>
                    </div>
                    <button class="carousel-btn" id="btn-next-sorteo" onclick="moverSorteosModal(1)">&#10095;</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ticket-modal" id="ticket-modal">
        <div class="ticket-content" id="ticket-content"></div>
    </div>

    <!-- CARRITO FLOTANTE -->
    <div class="carrito-overlay" id="carrito-overlay" onclick="toggleCarrito()"></div>
    <div class="carrito-sidebar" id="carrito-sidebar">
        <div class="carrito-header"><h3>Tu Carrito</h3><button class="btn-cerrar" onclick="toggleCarrito()">✕</button></div>
        <div class="carrito-items" id="carrito-items"></div>
        <div class="carrito-footer">
            <div class="carrito-total"><span>Total:</span><span id="carrito-total-precio">S/ 0.00</span></div>
            <button id="btn-ir-pagar" class="btn-solid" style="width: 100%; padding: 0.8rem; cursor: pointer; border: none; font-size: 1rem;" onclick="irAPagar()">Ir a Pagar</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let sorteosGlobal = [];
        let sorteoActivo = null;
        let indiceSorteoModal = 0;
        let indiceHero = 0;
        let intervaloSorteos;

        let todosLosProductos = [];
        let productosFiltrados = [];
        let indiceProducto = 0;
        const itemsPorVista = 3;
        const anchoTarjetaProducto = 312;

        function bloquearScroll() { document.body.classList.add('no-scroll'); }
        function desbloquearScroll() { document.body.classList.remove('no-scroll'); }

        async function cargarConfiguracionYLogo() {
            try {
                const res = await fetch('/api/config-publica');
                const config = await res.json();
                if (config.logo_admin) {
                    document.getElementById('logo-header').innerHTML = `<img src="${config.logo_admin}" class="logo-img-dinamico">`;
                }
                const btnWhatsApp = document.getElementById('btn-whatsapp');
                if (config.whatsapp) {
                    const numeroLimpio = config.whatsapp.replace(/\D/g, '');
                    btnWhatsApp.href = `https://wa.me/51${numeroLimpio}?text=Hola,%20estoy%20interesado%20en%20un%20producto%20de%20Mariposita`;
                } else {
                    btnWhatsApp.style.display = 'none';
                }
            } catch (e) { console.error("Error al cargar config", e); }
        }

        async function initHeroSorteos() {
            try {
                const resBg = await fetch('/api/carrusel');
                const imagenesBg = await resBg.json();
                const bgContainer = document.getElementById('hero-bg-container');
                
                if (imagenesBg.length > 0) {
                    bgContainer.innerHTML = imagenesBg.map((img, i) => `
                        <div class="hero-bg-slide ${i === 0 ? 'active' : ''}" style="background-image: url('${img.imagen_base64}');"></div>
                    `).join('');
                    
                    setInterval(() => {
                        const slides = document.querySelectorAll('.hero-bg-slide');
                        if (slides.length <= 1) return;
                        let current = Array.from(slides).findIndex(s => s.classList.contains('active'));
                        slides[current].classList.remove('active');
                        current = (current + 1) % slides.length;
                        slides[current].classList.add('active');
                    }, 5000);
                } else {
                    bgContainer.innerHTML = `<div class="hero-bg-slide active" style="background-color: #03131d;"></div>`;
                }
            } catch (e) { console.error("Error cargando fondos", e); }

            try {
                const res = await fetch('/api/sorteos');
                sorteosGlobal = await res.json();
                if (sorteosGlobal.length > 0) {
                    renderHeroContent(0);
                    intervaloSorteos = setInterval(() => moverHero(1), 5000);
                }
            } catch (e) {}
        }

        function renderHeroContent(index) {
            const sorteo = sorteosGlobal[index];
            document.getElementById('hero-info').innerHTML = `
                <span style="color: var(--accent-cyan); font-size: 0.85rem; font-weight: 700; text-transform: uppercase;">🎁 Sorteo Activo</span>
                <h1 class="hero-titulo-fijo" style="margin-top: 0.5rem;">${sorteo.nombre}</h1>
                <p class="hero-desc-fija">${sorteo.descripcion || 'Participa por esta hermosa prenda.'}</p>
                <button class="btn-solid" onclick="abrirModalSorteos()" style="margin-top: 1rem;">Ver todos los Sorteos</button>
            `;
            if (sorteo.imagen_base64) {
                document.getElementById('hero-imagen-container').innerHTML = `<img src="${sorteo.imagen_base64}" style="width:100%; height:100%; object-fit:cover; border-radius:12px;">`;
            } else {
                document.getElementById('hero-imagen-container').innerHTML = `<div style="width:100%; height:100%; background:#0a192f; display:flex; justify-content:center; align-items:center; color:#8892b0; border-radius:12px;">Sin imagen</div>`;
            }
        }

        function moverHero(dir) {
            if (sorteosGlobal.length <= 1) return;
            clearInterval(intervaloSorteos);
            indiceHero = (indiceHero + dir + sorteosGlobal.length) % sorteosGlobal.length;
            renderHeroContent(indiceHero);
            intervaloSorteos = setInterval(() => moverHero(1), 5000);
        }

        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                todosLosProductos = await res.json();
                filtrarYRenderizar();
            } catch (error) {
                console.error("Error cargando productos", error);
            }
        }

        function filtrarYRenderizar() {
            const textoBusqueda = document.getElementById('buscador-productos').value.toLowerCase();
            productosFiltrados = todosLosProductos.filter(p => 
                p.nombre.toLowerCase().includes(textoBusqueda) || 
                (p.categoria && p.categoria.toLowerCase().includes(textoBusqueda))
            );
            indiceProducto = 0;
            renderizarProductos();
        }

        function renderizarProductos() {
            const track = document.getElementById('grid-productos');
            const btnPrev = document.getElementById('btn-prev-prod');
            const btnNext = document.getElementById('btn-next-prod');

            if (!productosFiltrados.length) { 
                track.innerHTML = '<p style="padding:2rem; color:#fff;">No se encontraron productos.</p>'; 
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                return; 
            }

            track.innerHTML = productosFiltrados.map(p => `
                <div class="card-producto">
                    <img src="${p.imagen_base64 ? p.imagen_base64 : 'https://via.placeholder.com/300x200/132d46/00d2ff?text=' + encodeURIComponent(p.nombre)}" alt="${p.nombre}">
                    <div class="info">
                        <h3 title="${p.nombre}">${p.nombre}</h3>
                        <p>${p.descripcion || ''}</p>
                        <div class="precio">S/ ${p.precio.toFixed(2)}</div>
                        <div class="stock">Stock: ${p.stock} unidades</div>
                        <button class="btn-primario" onclick='agregarAlCarrito(${JSON.stringify(p).replace(/'/g, "&apos;")})' ${p.stock === 0 ? 'disabled' : ''}>
                            ${p.stock === 0 ? 'Agotado' : 'Añadir al carrito'}
                        </button>
                    </div>
                </div>
            `).join('');

            if (productosFiltrados.length <= itemsPorVista) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                track.style.transform = `translateX(0px)`;
            } else {
                btnPrev.style.display = 'flex';
                btnNext.style.display = 'flex';
                actualizarCarruselProductos();
            }
        }

        function moverProductos(dir) {
            if (productosFiltrados.length <= itemsPorVista) return;
            indiceProducto += dir;
            const maxIndex = productosFiltrados.length - itemsPorVista;
            if (indiceProducto < 0) indiceProducto = 0;
            if (indiceProducto > maxIndex) indiceProducto = maxIndex;
            actualizarCarruselProductos();
        }

        function actualizarCarruselProductos() {
            const track = document.getElementById('grid-productos');
            const desplazamiento = indiceProducto * anchoTarjetaProducto;
            track.style.transform = `translateX(-${desplazamiento}px)`;

            const btnPrev = document.getElementById('btn-prev-prod');
            const btnNext = document.getElementById('btn-next-prod');
            const maxIndex = productosFiltrados.length - itemsPorVista;
            
            btnPrev.disabled = indiceProducto === 0;
            btnNext.disabled = indiceProducto === maxIndex;
        }

        function obtenerCarrito() { return JSON.parse(localStorage.getItem('carrito') || '[]'); }
        function guardarCarrito(carrito) { localStorage.setItem('carrito', JSON.stringify(carrito)); actualizarCarritoUI(); }
        
        function agregarAlCarrito(producto) {
            let carrito = obtenerCarrito();
            const existente = carrito.find(i => i.producto_id === producto.id);
            if (existente) { existente.cantidad += 1; } 
            else { carrito.push({ producto_id: producto.id, nombre: producto.nombre, precio: producto.precio, imagen: producto.imagen_base64, cantidad: 1 }); }
            guardarCarrito(carrito); mostrarToast(`"${producto.nombre}" añadido`, 'success'); abrirCarrito();
        }

        function cambiarCantidad(index, delta) {
            let carrito = obtenerCarrito(); carrito[index].cantidad += delta;
            if (carrito[index].cantidad < 1) carrito.splice(index, 1);
            guardarCarrito(carrito);
        }

        function eliminarDelCarrito(index) { let carrito = obtenerCarrito(); carrito.splice(index, 1); guardarCarrito(carrito); }

        function actualizarCarritoUI() {
            const carrito = obtenerCarrito();
            const itemsDiv = document.getElementById('carrito-items');
            const count = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            document.getElementById('cart-count').textContent = count;
            document.getElementById('carrito-total-precio').textContent = `S/ ${total.toFixed(2)}`;

            if (carrito.length === 0) {
                itemsDiv.innerHTML = '<p style="text-align:center; color:#8892b0; margin-top:2rem;">Tu carrito está vacío.</p>';
                return;
            }

            itemsDiv.innerHTML = carrito.map((item, index) => `
                <div class="carrito-item">
                    <img src="${item.imagen || 'https://via.placeholder.com/60'}" alt="${item.nombre}">
                    <div class="item-info">
                        <h4>${item.nombre}</h4>
                        <p>S/ ${item.precio.toFixed(2)}</p>
                        <div class="item-controls">
                            <button onclick="cambiarCantidad(${index}, -1)">−</button>
                            <span>${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${index}, 1)">+</button>
                        </div>
                    </div>
                    <button class="btn-eliminar" onclick="eliminarDelCarrito(${index})">🗑️</button>
                </div>
            `).join('');
        }

        function toggleCarrito() {
            const sidebar = document.getElementById('carrito-sidebar');
            const overlay = document.getElementById('carrito-overlay');
            if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); overlay.classList.remove('active'); } 
            else { abrirCarrito(); }
        }

        function abrirCarrito() { document.getElementById('carrito-sidebar').classList.add('active'); document.getElementById('carrito-overlay').classList.add('active'); }
        
        function mostrarToast(msg, tipo) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show ' + (tipo || '');
            setTimeout(() => { t.className = 'toast'; }, 3500);
        }

        function irAPagar() {
            const carrito = obtenerCarrito();
            if (carrito.length === 0) {
                mostrarToast("Tu carrito está vacío. Agrega productos primero.", "error");
                return;
            }
            toggleCarrito();
            window.location.href = '/carrito.html';
        }

        function abrirModalSorteos() {
            const track = document.getElementById('sorteos-track');
            const btnPrev = document.getElementById('btn-prev-sorteo');
            const btnNext = document.getElementById('btn-next-sorteo');

            track.innerHTML = sorteosGlobal.map(s => {
                const fechaSorteo = new Date(`${s.fecha_sorteo}T23:59:59`).getTime();
                const yaFinalizo = new Date().getTime() > fechaSorteo;
                const boton = yaFinalizo 
                    ? `<div class="btn-finalizado">Sorteo Finalizado</div>`
                    : `<button class="btn-comprar" onclick="window.abrirModalTicket(${s.id})">Comprar Ticket</button>`;

                return `
                    <div class="card-sorteo-carrusel">
                        <img src="${s.imagen_base64 || 'https://via.placeholder.com/300x150'}">
                        <div class="info">
                            <h3>${s.nombre}</h3>
                            <div class="precio">S/ ${s.precio_ticket.toFixed(2)}</div>
                            ${boton}
                        </div>
                    </div>
                `;
            }).join('');

            indiceSorteoModal = 0;
            if (sorteosGlobal.length <= 2) {
                btnPrev.style.display = 'none'; btnNext.style.display = 'none';
            } else {
                btnPrev.style.display = 'flex'; btnNext.style.display = 'flex';
            }

            actualizarCarruselSorteos();
            document.getElementById('sorteos-modal').classList.add('active'); 
            bloquearScroll();
        }

        function moverSorteosModal(dir) {
            if (sorteosGlobal.length <= 2) return;
            indiceSorteoModal += dir;
            if (indiceSorteoModal < 0) indiceSorteoModal = 0;
            const maxIndex = sorteosGlobal.length - 2;
            if (indiceSorteoModal > maxIndex) indiceSorteoModal = maxIndex;
            actualizarCarruselSorteos();
        }

        function actualizarCarruselSorteos() {
            const track = document.getElementById('sorteos-track');
            const anchoTarjeta = 299.2;
            track.style.transform = `translateX(-${indiceSorteoModal * anchoTarjeta}px)`;

            if (sorteosGlobal.length > 2) {
                const btnPrev = document.getElementById('btn-prev-sorteo');
                const btnNext = document.getElementById('btn-next-sorteo');
                btnPrev.disabled = indiceSorteoModal === 0;
                btnNext.disabled = indiceSorteoModal === (sorteosGlobal.length - 2);
            }
        }

        function cerrarModalSorteos() { document.getElementById('sorteos-modal').classList.remove('active'); if(!document.getElementById('ticket-modal').classList.contains('active')) desbloquearScroll(); }

        window.abrirModalTicket = function(id) {
            sorteoActivo = sorteosGlobal.find(s => s.id === id);
            if (!sorteoActivo) return;
            let opcionesCantidad = '';
            for (let i = 1; i <= 20; i++) opcionesCantidad += `<option value="${i}">${i} Ticket(s)</option>`;

            document.getElementById('ticket-content').innerHTML = `
                <div class="ticket-header"><h2>Comprar: ${sorteoActivo.nombre}</h2><button class="resultado-close" onclick="cerrarModalTicket()">✕</button></div>
                <div class="ticket-body">
                    <form id="form-ticket" enctype="multipart/form-data">
                        <input type="hidden" id="sorteo-id" name="sorteo_id" value="${id}">
                        <div class="form-group"><label class="form-label">DNI <span>*</span></label><div class="input-wrapper"><input type="text" id="dni-input" name="dni" maxlength="8" required></div></div>
                        <div class="form-group"><label class="form-label">NOMBRES <span>*</span></label><div class="input-wrapper"><input type="text" name="nombre" id="nombre-input" required></div></div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label">WHATSAPP <span>*</span></label><div class="input-wrapper dark"><input type="tel" name="telefono" id="telefono-input" required></div></div>
                            <div class="form-group"><label class="form-label">DEPARTAMENTO <span>*</span></label><div class="input-wrapper dark"><select name="departamento" id="departamento-select" required>
                                <option value="Amazonas">Amazonas</option>
                                <option value="Áncash">Áncash</option>
                                <option value="Apurímac">Apurímac</option>
                                <option value="Arequipa">Arequipa</option>
                                <option value="Ayacucho">Ayacucho</option>
                                <option value="Cajamarca">Cajamarca</option>
                                <option value="Callao">Callao</option>
                                <option value="Cusco">Cusco</option>
                                <option value="Huancavelica">Huancavelica</option>
                                <option value="Huánuco">Huánuco</option>
                                <option value="Ica">Ica</option>
                                <option value="Junín">Junín</option>
                                <option value="La Libertad">La Libertad</option>
                                <option value="Lambayeque">Lambayeque</option>
                                <option value="Lima">Lima</option>
                                <option value="Loreto">Loreto</option>
                                <option value="Madre de Dios">Madre de Dios</option>
                                <option value="Moquegua">Moquegua</option>
                                <option value="Pasco">Pasco</option>
                                <option value="Piura">Piura</option>
                                <option value="Puno">Puno</option>
                                <option value="San Martín">San Martín</option>
                                <option value="Tacna">Tacna</option>
                                <option value="Tumbes">Tumbes</option>
                                <option value="Ucayali">Ucayali</option>
                            </select></div></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label">CANTIDAD</label><div class="input-wrapper dark"><select id="cantidad-tickets" name="cantidad" onchange="actualizarTotalModal()">${opcionesCantidad}</select></div></div>
                            <div class="form-group"><label class="form-label">TOTAL</label><div class="total-box"><div class="total-amount" id="total-display">S/ ${sorteoActivo.precio_ticket.toFixed(2)}</div></div></div>
                        </div>
                        
                        <div class="pago-box">
                            <h4>💳 Paga a:</h4>
                            <p>Yape: <span class="pago-numero" id="info-yape">...</span></p>
                            <p>Plin: <span class="pago-numero" id="info-plin">...</span></p>
                        </div>

                        <div class="form-group">
                            <label class="form-label">COMPROBANTE <span>*</span></label>
                            <div class="upload-zone">
                                <input type="file" name="comprobante" accept=".jpg,.jpeg,.png,.webp" required>
                                <div class="upload-title">☁️ SUBIR COMPROBANTE</div>
                            </div>
                            <div style="background: rgba(0, 210, 255, 0.05); border-left: 3px solid var(--accent-cyan); padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;">
                                <p style="color: var(--accent-cyan); font-weight: 700; font-size: 0.75rem; margin-bottom: 0.3rem; text-transform: uppercase;">Especificaciones:</p>
                                <ul style="color: #8892b0; font-size: 0.75rem; margin-left: 1rem; line-height: 1.4;">
                                    <li>Recorta la imagen dejando <strong>solo la parte blanca</strong> de la tarjeta de Yape/Plin.</li>
                                    <li>No incluyas bordes negros, barras de estado ni botones del celular.</li>
                                    <li>Asegúrate de que el <strong>monto</strong> y la <strong>fecha</strong> se vean nítidos.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- ⭐ BARRA DE PROGRESO DE VALIDACIÓN (OCULTA POR DEFECTO) -->
                        <div id="progreso-validacion" class="progress-container">
                            <div class="progress-step" id="step-1"><div class="spinner-small"></div> Analizando formato de imagen...</div>
                            <div class="progress-step" id="step-2"><div class="spinner-small"></div> Leyendo datos del comprobante (IA)...</div>
                            <div class="progress-step" id="step-3"><div class="spinner-small"></div> Verificando monto y destinatario...</div>
                            <div class="progress-step" id="step-4"><div class="spinner-small"></div> Registrando ticket en el sistema...</div>
                        </div>

                        <button type="submit" class="btn-submit" id="btn-comprar">Confirmar Compra</button>
                    </form>
                </div>
            `;

            fetch('/api/config-publica').then(r => r.json()).then(c => {
                document.getElementById('info-yape').textContent = c.numero_yape;
                document.getElementById('info-plin').textContent = c.numero_plin;
            });

            let timeoutBusqueda = null;
            document.getElementById('dni-input').addEventListener('input', function(e) {
                clearTimeout(timeoutBusqueda);
                const dni = e.target.value;
                if (dni.length === 8) {
                    document.getElementById('nombre-input').value = 'Buscando...';
                    timeoutBusqueda = setTimeout(async () => {
                        try {
                            const res = await fetch(`/api/buscar-dni/${dni}`);
                            const data = await res.json();
                            if (data.encontrado) {
                                document.getElementById('nombre-input').value = data.cliente.nombre;
                                document.getElementById('telefono-input').value = data.cliente.telefono;
                                document.getElementById('nombre-input').disabled = true;
                            } else {
                                document.getElementById('nombre-input').value = '';
                                document.getElementById('nombre-input').placeholder = 'Escribe tu nombre';
                                document.getElementById('nombre-input').disabled = false;
                            }
                        } catch (e) {}
                    }, 800);
                }
            });

            // ⭐ LÓGICA DE ENVÍO CON PROGRESO ANIMADO
            document.getElementById('form-ticket').addEventListener('submit', async (e) => {
                e.preventDefault(); 
                const btn = document.getElementById('btn-comprar');
                const progreso = document.getElementById('progreso-validacion');
                const steps = [1, 2, 3, 4];
                
                // Deshabilitar botón y mostrar progreso
                btn.disabled = true; 
                btn.innerHTML = '<div class="spinner"></div> Procesando...';
                progreso.style.display = 'block';
                
                // Ocultar todos los pasos primero
                steps.forEach(s => {
                    const el = document.getElementById(`step-${s}`);
                    el.classList.remove('active', 'done');
                    el.style.opacity = '0.4';
                });
                
                // Activar paso 1
                document.getElementById('step-1').classList.add('active');
                document.getElementById('step-1').style.opacity = '1';

                // Simular el avance visual de los pasos
                const tiempos = [1200, 3000, 5000]; // Tiempos estimados en milisegundos
                tiempos.forEach((time, index) => {
                    setTimeout(() => {
                        // Marcar paso anterior como completado
                        const prevStep = document.getElementById(`step-${steps[index]}`);
                        if (prevStep) {
                            prevStep.classList.remove('active');
                            prevStep.classList.add('done');
                            prevStep.style.opacity = '1';
                            prevStep.innerHTML = '✅ ' + prevStep.textContent.trim();
                        }
                        // Activar paso actual
                        const currentStep = document.getElementById(`step-${steps[index + 1]}`);
                        if (currentStep) {
                            currentStep.classList.add('active');
                            currentStep.style.opacity = '1';
                        }
                    }, time);
                });

                document.getElementById('nombre-input').disabled = false;
                
                const fd = new FormData(e.target);
                try {
                    const res = await fetch('/api/tickets', { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (!res.ok) throw new Error(data.error);
                    
                    // Marcar último paso como completado
                    const lastStep = document.getElementById('step-4');
                    if (lastStep) {
                        lastStep.classList.remove('active');
                        lastStep.classList.add('done');
                        lastStep.innerHTML = '✅ ' + lastStep.textContent.trim();
                    }

                    // Pequeña pausa para que se vea el último check
                    await new Promise(r => setTimeout(r, 600));

                    // ⭐ NUEVO DISEÑO DEL TICKET DE ÉXITO
                    const cantTickets = document.getElementById('cantidad-tickets').value;
                    
                    document.getElementById('ticket-content').innerHTML = `
                        <div class="success-ticket-wrapper">
                            <div class="success-header">
                                <div class="success-header-icon">✓</div>
                                <div class="success-header-text">
                                    <h3>¡PARTICIPACIÓN CONFIRMADA! 🎉</h3>
                                    <p>Tienes <strong>${cantTickets} ticket(s) activo(s)</strong> para el sorteo.</p>
                                </div>
                            </div>

                            <div class="purple-ticket-card">
                                <div class="ticket-top">
                                    <div class="premios-logo">
                                        🏆 PREMIOS EN VIVO
                                    </div>
                                    <div class="status-badge">
                                        <div class="status-dot"></div> ACTIVO
                                    </div>
                                </div>

                                <div class="ticket-number-box">
                                    <p>TICKET #</p>
                                    <h1>${data.numero_ticket.replace('TKT-', '')}</h1>
                                </div>

                                <div class="ticket-details-row">
                                    <div class="ticket-detail-item">
                                        <span>👤 PARTICIPANTE</span>
                                        <strong>${fd.get('nombre')}</strong>
                                    </div>
                                    <div class="ticket-detail-item">
                                        <span>📍 DEPARTAMENTO</span>
                                        <strong>${document.getElementById('departamento-select').value}</strong>
                                    </div>
                                </div>
                            </div>

                            <button onclick="location.reload()" class="btn-ver-tickets">
                                <span style="width: 20px;"></span>
                                VER TODOS MIS TICKETS
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                                </svg>
                            </button>

                            <div class="security-text">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.061.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.775 11.775 0 0 1-2.517 2.453 7.159 7.159 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7.158 7.158 0 0 1-1.048-.625 11.777 11.777 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 62.456 62.456 0 0 1 5.072.56z"/>
                                </svg>
                                Tu participación está 100% segura.
                            </div>
                        </div>
                    `;
                } catch (error) {
                    alert("⚠️ Error: " + error.message); 
                    btn.disabled = false; 
                    btn.innerHTML = 'Confirmar Compra';
                    progreso.style.display = 'none';
                }
            });

            document.getElementById('ticket-modal').classList.add('active'); bloquearScroll();
        }

        function cerrarModalTicket() { document.getElementById('ticket-modal').classList.remove('active'); if(!document.getElementById('sorteos-modal').classList.contains('active')) desbloquearScroll(); }
        function actualizarTotalModal() { const cant = parseInt(document.getElementById('cantidad-tickets').value); document.getElementById('total-display').textContent = `S/ ${(sorteoActivo.precio_ticket * cant).toFixed(2)}`; }

        async function buscarPedidoPublico() {
            const query = document.getElementById('input-dni').value.trim();
            if (!query) {
                mostrarToast("Por favor, ingresa un DNI o Teléfono", "error");
                return;
            }

            const body = document.getElementById('resultado-body');
            body.innerHTML = '<p style="color:#00d2ff; text-align:center;">Buscando en la base de datos...</p>';
            document.getElementById('resultado-overlay').classList.add('active');
            bloquearScroll();

            try {
                const res = await fetch(`/api/consultar?query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (!data.ordenes || !data.tickets || (data.ordenes.length === 0 && data.tickets.length === 0)) {
                    body.innerHTML = `
                        <div style="text-align: center; padding: 3rem 1rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🔎</div>
                            <h3 style="color: #fff; margin-bottom: 1rem;">No encontramos resultados</h3>
                            <p style="color: #8892b0; margin-bottom: 2rem;">
                                Revisa bien tus datos (DNI o número de teléfono) e inténtalo de nuevo. <br>
                                O si aún no has participado, ¡no te quedes fuera!
                            </p>
                            <button onclick="cerrarResultado(); abrirModalSorteos();" class="btn-primario" style="background: var(--accent-cyan); color: #000; padding: 0.8rem 2rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                                🎁 Ir a Participar en los Sorteos
                            </button>
                        </div>
                    `;
                    return;
                }

                let html = '';
                
                if (data.ordenes.length > 0) {
                    html += '<h3 style="color: #00d2ff; margin-bottom: 1rem;">🛍️ Tus Compras de Ropa</h3>';
                    data.ordenes.forEach(o => {
                        html += `
                            <div style="background:#0d253f; padding:1rem; border-radius:8px; margin-bottom:1rem; border-left:4px solid #00d2ff;">
                                <p style="color:#fff; margin-bottom:0.3rem;"><strong>Orden:</strong> ${o.codigo}</p>
                                <p style="color:#ccc; font-size:0.9rem;"><strong>Fecha:</strong> ${o.creado_en}</p>
                                <p style="color:#ccc; font-size:0.9rem;"><strong>Total:</strong> S/ ${o.total.toFixed(2)}</p>
                                <p style="color:${o.estado === 'aprobado' ? '#25d366' : o.estado === 'rechazado' ? '#ff4d4d' : '#ffcc00'}; font-weight:bold;">
                                    Estado: ${o.estado.toUpperCase()}
                                </p>
                                ${o.estado === 'rechazado' && o.notas_admin ? `<p style="color:#ff4d4d; font-size:0.85rem;">Motivo: ${o.notas_admin}</p>` : ''}
                            </div>
                        `;
                    });
                }

                if (data.tickets.length > 0) {
                    html += '<h3 style="color: #00d2ff; margin-bottom: 1rem; margin-top:1.5rem;">🎟️ Tus Tickets de Sorteo</h3>';
                    data.tickets.forEach(t => {
                        html += `
                            <div style="background:#0d253f; padding:1rem; border-radius:8px; margin-bottom:1rem; border-left:4px solid #ffcc00;">
                                <p style="color:#fff; margin-bottom:0.3rem;"><strong>Ticket:</strong> ${t.numero_ticket}</p>
                                <p style="color:#ccc; font-size:0.9rem;"><strong>Sorteo:</strong> ${t.sorteo_nombre}</p>
                                <p style="color:#ccc; font-size:0.9rem;"><strong>Fecha:</strong> ${t.creado_en}</p>
                                <p style="color:${t.estado_pago === 'aprobado' ? '#25d366' : t.estado_pago === 'rechazado' ? '#ff4d4d' : '#ffcc00'}; font-weight:bold;">
                                    Estado: ${t.estado_pago.toUpperCase()}
                                </p>
                                ${t.estado_pago === 'rechazado' && t.notas_admin ? `<p style="color:#ff4d4d; font-size:0.85rem;">Motivo: ${t.notas_admin}</p>` : ''}
                            </div>
                        `;
                    });
                }
                
                body.innerHTML = html;

            } catch (error) {
                console.error("Error al buscar:", error);
                body.innerHTML = '<p style="color:#ff4d4d; text-align:center;">Error al conectar con el servidor. Intenta más tarde.</p>';
            }
        }

        function cerrarResultado() {
            document.getElementById('resultado-overlay').classList.remove('active');
            document.getElementById('input-dni').value = '';
            
            if(!document.getElementById('ticket-modal').classList.contains('active') && !document.getElementById('sorteos-modal').classList.contains('active')) {
                desbloquearScroll();
            }
        }
        
        // INICIALIZADORES
        cargarConfiguracionYLogo();
        initHeroSorteos(); 
        cargarProductos(); 
        actualizarCarritoUI();
    </script>
</body>
</html>
