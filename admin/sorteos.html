<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Sorteos · Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    /* ... (Mantén tus estilos de modal aquí) ... */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: #fff; width: 90%; max-width: 600px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: var(--color-primario); color: #fff; }
    .modal-header h3 { margin: 0; font-size: 1.3rem; }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .modal-close:hover { color: #ff4d4d; }
    .modal-body { padding: 2rem; overflow-y: auto; }
    .modal-footer { padding: 1.5rem 2rem; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 1rem; background: #f9f9f9; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1.5rem; }
    .pagination button { background: var(--color-primario); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .pagination button:disabled { background: #ccc; cursor: not-allowed; }
    .pagination span { font-weight: bold; color: #333; }
    .img-tabla { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
    .btn-accion { padding: 0.4rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; margin: 0 2px; }
    .btn-editar { background: #e3f2fd; color: #1565c0; border: 1px solid #1565c0; }
    .btn-editar:hover { background: #1565c0; color: #fff; }
    .btn-eliminar { background: #ffebee; color: #c62828; border: 1px solid #c62828; }
    .btn-eliminar:hover { background: #c62828; color: #fff; }

    /* Estilos nuevos para la barra de progreso */
    .progress-container { display: none; margin-top: 1rem; background: #f0f4f8; padding: 1rem; border-radius: 8px; border: 1px solid #d9e2ec; }
    .progress-step { font-size: 0.85rem; color: #627d98; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.5rem; }
    .progress-step.active { color: var(--color-primario); font-weight: bold; }
    .progress-step.done { color: #2e7d32; }
    .spinner-small { width: 12px; height: 12px; border: 2px solid rgba(0, 119, 182, 0.2); border-top-color: var(--color-primario); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- ... (Mantén tu HTML de la tabla y menú lateral igual) ... -->
<div class="admin-layout">
    <aside class="sidebar">
        <h1>🦋 Mariposita</h1>
        <a href="/admin/dashboard.html">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" class="active">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html">🔍 Buscar Cliente</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    <main class="main">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
            <h2 style="margin:0;">Sorteos</h2>
            <button class="btn btn-primario" onclick="abrirModalNuevo()">+ Nuevo Sorteo</button>
        </div>
        <div id="lista"></div>
        <div class="pagination" id="paginacion">
            <button id="btn-prev" onclick="cambiarPagina(-1)">◀ Anterior</button>
            <span id="page-info">Página 1 de 1</span>
            <button id="btn-next" onclick="cambiarPagina(1)">Siguiente ▶</button>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-sorteo">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="form-title">Nuevo Sorteo</h3>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="form-sorteo" enctype="multipart/form-data">
                <input type="hidden" name="id" id="sorteo-id">
                <div class="form-group"><label>Nombre</label><input name="nombre" id="sorteo-nombre" required></div>
                <div class="form-group"><label>Descripción</label><textarea name="descripcion" id="sorteo-desc" rows="2"></textarea></div>
                <div class="form-group"><label>Precio del ticket (S/)</label><input type="number" step="0.01" name="precio_ticket" id="sorteo-precio" required></div>
                <div class="form-group"><label>Fecha del sorteo</label><input type="date" name="fecha_sorteo" id="sorteo-fecha" required></div>
                <div class="form-group"><label>Estado</label>
                    <select name="estado" id="sorteo-estado">
                        <option value="activo">Activo</option>
                        <option value="cerrado">Cerrado</option>
                        <option value="sorteado">Sorteado</option>
                    </select>
                </div>
                <div class="form-group"><label>Imagen del premio</label><input type="file" name="imagen" id="sorteo-imagen" accept=".jpg,.jpeg,.png,.webp"></div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
            <button type="submit" form="form-sorteo" class="btn btn-primario" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>

<script>
// ... (Mantén tu lógica de cargar, renderizar, etc. igual) ...
let todosLosSorteos = [];
let paginaActual = 1;
const itemsPorPagina = 5;

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    if (d.rol !== 'admin') {
        document.getElementById('nav-productos').style.display = 'none';
        document.getElementById('nav-carrusel').style.display = 'none';
        document.getElementById('nav-usuarios').style.display = 'none';
        document.getElementById('nav-config').style.display = 'none';
    }
    cargar();
}

async function cargar() {
    const r = await fetch('/api/admin/sorteos');
    if (r.status === 401) return location.href = '/admin/login.html';
    todosLosSorteos = await r.json();
    paginaActual = 1;
    renderizarTabla();
}

function renderizarTabla() { /* ... tu código ... */ }
function cambiarPagina(dir) { /* ... tu código ... */ }
function abrirModalNuevo() { /* ... tu código ... */ }
function editar(s) { /* ... tu código ... */ }
function cerrarModal() { document.getElementById('modal-sorteo').classList.remove('active'); }

// LOGICA DE ENVÍO
document.getElementById('form-sorteo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-guardar');
    const originalText = btn.textContent;
    
    // Validación visual
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const f = e.target; 
    const id = document.getElementById('sorteo-id').value; 
    const fd = new FormData(f);
    const url = id ? `/api/admin/sorteos/${id}` : '/api/admin/sorteos';
    const method = id ? 'PUT' : 'POST';

    try {
        const r = await fetch(url, { method, body: fd });
        const d = await r.json();
        
        if (r.ok) { 
            alert('Sorteo guardado correctamente'); 
            cerrarModal();
            cargar(); 
        } else { 
            alert('Error: ' + (d.error || 'Desconocido')); 
        }
    } catch (error) {
        alert('Error de red. Intenta de nuevo.');
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
});

checkAuth();
</script>
</body>
</html>
