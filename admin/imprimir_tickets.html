<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Tickets · Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .no-print {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            font-family: inherit;
            min-width: 250px;
        }

        .btn {
            padding: 10px 20px;
            background: #0077b6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn:hover { background: #005f8f; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Configuración de la hoja A4 */
        .hoja-a4 {
            width: 210mm;
            height: 297mm;
            background: #fff;
            padding: 10mm;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 columnas */
            grid-template-rows: repeat(4, 1fr); /* 4 filas */
            gap: 5mm;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Diseño del Ticket */
        .ticket {
            background-color: #FDF8F0;
            border-radius: 10px;
            border: 1px dashed #ccc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* Patrón de fondo simulado */
        .ticket::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#e0d6c8 1px, transparent 1px);
            background-size: 15px 15px;
            opacity: 0.5;
            z-index: 0;
        }

        .ticket-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        /* Número de ticket centrado y grande */
        .ticket-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .ticket-numero {
            background-color: #1B1464;
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            padding: 8px 15px;
            border-radius: 8px;
            letter-spacing: 1px;
            display: inline-block;
        }

        /* Cuerpo del ticket */
        .ticket-body {
            text-align: center;
            margin: 5px 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ticket-datos {
            background: rgba(255,255,255,0.8);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #E5D9C5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .ticket-datos h3 {
            margin: 0;
            font-size: 20px;
            color: #1B1464;
            font-weight: 900;
            text-transform: uppercase;
        }

        .ticket-datos p {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #333;
            font-weight: 700;
        }

        /* Nombre del evento debajo del nombre */
        .ticket-evento {
            font-size: 12px;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Pie del ticket */
        .ticket-footer {
            font-size: 10px;
            text-align: center;
            color: #888;
            border-top: 1px dashed #ccc;
            padding-top: 8px;
            margin-top: 5px;
        }

        /* Al imprimir */
        @media print {
            body { background: #fff; padding: 0; margin: 0; }
            .no-print { display: none; }
            .hoja-a4 { 
                box-shadow: none; 
                border: none; 
                width: 100%; 
                height: 100vh; 
                page-break-after: always; 
                margin-bottom: 0;
            }
            .ticket { border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <div>
            <label style="font-weight: bold; margin-right: 10px;">Filtrar por Sorteo:</label>
            <select id="select-sorteo" onchange="cargarTickets()">
                <option value="">Todos los sorteos</option>
            </select>
        </div>
        <button class="btn" onclick="window.print()">🖨️ Imprimir Hoja Actual</button>
        <button class="btn" onclick="window.close()" style="background:#555;">Cerrar Pestaña</button>
    </div>

    <div id="contenedor-hojas">
        <p style="text-align: center; color: #666; margin-top: 50px;">Cargando tickets...</p>
    </div>

    <script>
        // Cargar los sorteos en el select al iniciar
        async function cargarSorteos() {
            const select = document.getElementById('select-sorteo');
            try {
                const res = await fetch('/api/sorteos');
                if (!res.ok) throw new Error('Error al cargar sorteos');
                const sorteos = await res.json();
                
                select.innerHTML = '<option value="">Todos los sorteos</option>' + 
                    sorteos.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
                
                cargarTickets();
            } catch (e) {
                select.innerHTML = '<option value="">Error al cargar sorteos</option>';
                document.getElementById('contenedor-hojas').innerHTML = `<p style="color:red; text-align:center;">Error al cargar los sorteos. Verifica tu sesión.</p>`;
            }
        }

        // Cargar los tickets según el filtro
        async function cargarTickets() {
            const contenedor = document.getElementById('contenedor-hojas');
            const sorteoId = document.getElementById('select-sorteo').value;
            
            contenedor.innerHTML = '<p style="text-align: center; color: #666; margin-top: 50px;">Buscando tickets...</p>';

            try {
                const res = await fetch('/api/admin/tickets/aprobados');
                
                if (res.status === 401) throw new Error('Sesión expirada. Vuelve a iniciar sesión.');
                if (!res.ok) throw new Error('Error en el servidor al buscar tickets.');

                let tickets = await res.json();

                // Filtrar por sorteo si es que se seleccionó uno
                if (sorteoId) {
                    tickets = tickets.filter(t => t.sorteo_id == sorteoId);
                }

                if (tickets.length === 0) {
                    contenedor.innerHTML = '<p style="text-align: center; color: #666; margin-top: 50px;">No hay tickets aprobados para imprimir en este sorteo.</p>';
                    return;
                }

                contenedor.innerHTML = ''; 
                
                // Agrupar en bloques de 8
                const tamañoPagina = 8;
                for (let i = 0; i < tickets.length; i += tamañoPagina) {
                    const paginaTickets = tickets.slice(i, i + tamañoPagina);
                    
                    const hoja = document.createElement('div');
                    hoja.className = 'hoja-a4';

                    paginaTickets.forEach(t => {
                        const ticketDiv = document.createElement('div');
                        ticketDiv.className = 'ticket';
                        
                        const codigoCorto = t.numero_ticket.replace('TKT-', '');

                        ticketDiv.innerHTML = `
                            <div class="ticket-content">
                                <div class="ticket-header">
                                    <div class="ticket-numero">#${codigoCorto}</div>
                                </div>
                                <div class="ticket-body">
                                    <div class="ticket-datos">
                                        <h3>${t.cliente_nombre}</h3>
                                        <p>📞 ${t.cliente_telefono || 'Sin teléfono'}</p>
                                    </div>
                                    <div class="ticket-evento">${t.sorteo_nombre}</div>
                                </div>
                                <div class="ticket-footer">
                                    ¡Participa y gana! Sorteo en Vivo.
                                </div>
                            </div>
                        `;
                        hoja.appendChild(ticketDiv);
                    });

                    const faltantes = tamañoPagina - paginaTickets.length;
                    for (let j = 0; j < faltantes; j++) {
                        const ticketVacio = document.createElement('div');
                        ticketVacio.className = 'ticket';
                        ticketVacio.style.opacity = '0.2';
                        hoja.appendChild(ticketVacio);
                    }

                    contenedor.appendChild(hoja);
                }

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `<p style="color:red; text-align:center; font-weight:bold; margin-top: 50px;">${error.message}</p>`;
            }
        }

        cargarSorteos();
    </script>
</body>
</html>
