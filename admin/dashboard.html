<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Dashboard · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    /* ⭐ FONDO DE PANTALLA CON PAISAJE DE LA SIERRA ⭐ */
    body {
        background: linear-gradient(rgba(11, 27, 43, 0.85), rgba(11, 27, 43, 0.85)), 
                    url('https://images.unsplash.com/photo-1580619305218-8423a7ef79b4?q=80&w=2070&auto=format&fit=crop') 
                    no-repeat center center fixed !important;
        background-size: cover !important;
        height: 100vh;
        margin: 0;
        overflow: hidden; /* Evita el scroll en el body */
    }

    /* Hacemos que el fondo del layout sea transparente para que se vea la imagen */
    .admin-layout {
        background: transparent !important;
    }

    /* El sidebar lo dejamos semi-transparente para que se lea bien */
    .sidebar {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(5px);
        height: 100vh;
    }

    /* El contenedor principal también transparente */
    .main {
        background: transparent !important;
        padding: 2rem 3rem;
        height: 100vh;
        overflow-y: auto;
    }

    /* Hacemos que las letras del título sean blancas para que resalten en el paisaje */
    .main h2 {
        color: #ffffff !important;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    /* Estilos de las tarjetas de estadísticas con un poco de transparencia */
    .stat {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2) !important;
    }

    /* El contenedor de acciones rápidas */
    .card {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2) !important;
    }
</style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h1><img src="/admin/img/logo.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;" onerror="this.style.display='none';"> Mariposita</h1>
        
        <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" id="nav-sorteos">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html">🔍 Buscar Cliente</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    <main class="main">
        <h2 style="margin-bottom: 2rem;">Bienvenido, <span id="nombre"></span> (<span id="rol"></span>)</h2>
        
        <div class="stats-grid" id="stats" style="margin-bottom: 2rem;"></div>

        <div class="card">
            <h3 style="color:var(--color-primario); margin-bottom:1rem;">Acciones rápidas</h3>
            <p style="display:flex; gap:1rem; flex-wrap:wrap;">
                <a href="/admin/ordenes.html" class="btn btn-primario">Revisar órdenes</a>
                <a href="/admin/tickets.html" class="btn btn-primario">Revisar tickets</a>
                <a href="/admin/buscar.html" class="btn btn-acento">🔍 Buscar Cliente</a>
            </p>
        </div>
    </main>
</div>
<script>
async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    
    document.getElementById('nombre').textContent = d.nombre;
    document.getElementById('rol').textContent = d.rol;

    // Ocultar menús según el rol
    if (d.rol !== 'admin') {
        document.getElementById('nav-productos').style.display = 'none';
        document.getElementById('nav-sorteos').style.display = 'none';
        document.getElementById('nav-carrusel').style.display = 'none';
        document.getElementById('nav-usuarios').style.display = 'none';
        document.getElementById('nav-config').style.display = 'none';
    }
}

async function loadStats() {
    const r = await fetch('/api/admin/dashboard');
    if (r.status === 401) return location.href = '/admin/login.html';
    const d = await r.json();
    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="num">${d.ordenes_pendientes}</div><div class="label">Órdenes pendientes</div></div>
        <div class="stat"><div class="num">${d.tickets_pendientes}</div><div class="label">Tickets pendientes</div></div>
        <div class="stat"><div class="num">S/ ${d.ventas_aprobadas.toFixed(2)}</div><div class="label">Ventas aprobadas</div></div>
        <div class="stat"><div class="num">${d.total_ordenes}</div><div class="label">Órdenes totales</div></div>
    `;
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

checkAuth(); loadStats();
</script>
</body>
</html>
