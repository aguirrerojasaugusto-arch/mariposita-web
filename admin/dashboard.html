<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Dashboard · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    /* ⭐ FONDO DE PANTALLA CON PAISAJE DE LA SIERRA ⭐ */
    body {
        background: linear-gradient(rgba(11, 27, 43, 0.75), rgba(11, 27, 43, 0.75)), 
                    url('https://images.unsplash.com/photo-1580619305218-8423a7ef79b4?q=80&w=2070&auto=format&fit=crop') 
                    no-repeat center center fixed !important;
        background-size: cover !important;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .admin-layout {
        background: transparent !important;
    }

    /* ⭐ SIDEBAR ESTILO "GLASSMORPHISM" OSCURO ⭐ */
    .sidebar {
        background: rgba(16, 33, 50, 0.85) !important; 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        height: 100vh;
        box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
    }

    /* Título del Sidebar */
    .sidebar h1 {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 1rem;
        margin-bottom: 1rem;
    }

    /* ⭐ TARJETA DE PERFIL DE USUARIO ⭐ */
    .user-profile {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .user-avatar {
        width: 45px;
        height: 45px;
        background: var(--color-secundario);
        color: #000;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
        font-weight: bold;
    }
    .user-info {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .user-info strong {
        color: #fff;
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .user-info span {
        color: #8892b0;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Enlaces del menú */
    .sidebar a {
        color: #cbd5e1 !important; 
        border-radius: 8px;
        margin-bottom: 0.2rem;
        transition: all 0.3s;
    }

    /* Efecto Hover y Enlace Activo */
    .sidebar a:hover, 
    .sidebar a.active {
        background: rgba(0, 210, 255, 0.15) !important; 
        color: #00d2ff !important; 
        border-left: 4px solid #00d2ff;
        font-weight: 600;
    }

    /* Botón de cerrar sesión */
    .sidebar .logout {
        color: #ff6b6b !important;
        margin-top: auto; /* Empuja el botón al final */
    }
    .sidebar .logout:hover {
        background: rgba(255, 107, 107, 0.15) !important;
        color: #ff4d4d !important;
        border-left: 4px solid #ff4d4d;
    }

    /* Contenedor principal */
    .main {
        background: transparent !important;
        padding: 2rem 3rem;
        height: 100vh;
        overflow-y: auto;
    }

    .main h2 {
        color: #ffffff !important;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* Tarjetas y contenedores */
    .stat, .card {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.5);
    }

    /* ⭐ ANIMACIÓN DEL NÚMERO AL ACTUALIZARSE ⭐ */
    @keyframes flashGreen {
        0% { background-color: transparent; }
        30% { background-color: rgba(46, 125, 50, 0.2); }
        100% { background-color: transparent; }
    }
    .actualizado {
        animation: flashGreen 1s ease-out;
        border-radius: 4px;
    }
</style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h1><img src="/admin/img/logo.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;" onerror="this.style.display='none';"> Mariposita</h1>
        
        <!-- ⭐ PERFIL DEL USUARIO LOGUEADO ⭐ -->
        <div class="user-profile">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-info">
                <strong id="user-nombre">Cargando...</strong>
                <span id="user-rol">Admin</span>
            </div>
        </div>

        <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" id="nav-sorteos">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html">🔍 Buscar Cliente</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    <main class="main">
        <h2 style="margin-bottom: 2rem;">Bienvenido, <span id="saludo-nombre"></span></h2>
        
        <div class="stats-grid" id="stats" style="margin-bottom: 2rem;"></div>

        <div class="card">
            <h3 style="color:var(--color-primario); margin-bottom:1rem;">Acciones rápidas</h3>
            <p style="display:flex; gap:1rem; flex-wrap:wrap;">
                <a href="/admin/ordenes.html" class="btn btn-primario">Revisar órdenes</a>
                <a href="/admin/tickets.html" class="btn btn-primario">Revisar tickets</a>
                <a href="/admin/buscar.html" class="btn btn-acento">🔍 Buscar Cliente</a>
            </p>
        </div>
    </main>
</div>
<script>
async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    
    // ⭐ ACTUALIZAMOS LOS DATOS DEL PERFIL EN EL SIDEBAR ⭐
    document.getElementById('user-nombre').textContent = d.nombre;
    document.getElementById('user-rol').textContent = d.rol;
    document.getElementById('user-avatar').textContent = d.nombre.charAt(0).toUpperCase(); // Primera letra del nombre
    
    // Saludo principal
    document.getElementById('saludo-nombre').textContent = d.nombre;

    // Ocultar menús según el rol
    if (d.rol !== 'admin') {
        document.getElementById('nav-productos').style.display = 'none';
        document.getElementById('nav-sorteos').style.display = 'none';
        document.getElementById('nav-carrusel').style.display = 'none';
        document.getElementById('nav-usuarios').style.display = 'none';
        document.getElementById('nav-config').style.display = 'none';
    }
}

let ventasAnteriores = 0;

async function loadStats() {
    try {
        const r = await fetch('/api/admin/dashboard');
        if (r.status === 401) return location.href = '/admin/login.html';
        const d = await r.json();
        
        // Formatear el número con comas
        const ventasFormateadas = d.ventas_aprobadas.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        document.getElementById('stats').innerHTML = `
            <div class="stat"><div class="num">${d.ordenes_pendientes}</div><div class="label">Órdenes pendientes</div></div>
            <div class="stat"><div class="num">${d.tickets_pendientes}</div><div class="label">Tickets pendientes</div></div>
            <div class="stat">
                <div class="num" id="stat-ventas" style="display:inline-block; padding: 0 5px;">S/ ${ventasFormateadas}</div>
                <div class="label">Ventas aprobadas</div>
            </div>
            <div class="stat"><div class="num">${d.total_ordenes}</div><div class="label">Órdenes totales</div></div>
        `;

        // Efecto visual si el monto aumentó
        if (d.ventas_aprobadas > ventasAnteriores && ventasAnteriores !== 0) {
            const elVentas = document.getElementById('stat-ventas');
            if (elVentas) {
                elVentas.classList.add('actualizado');
                setTimeout(() => elVentas.classList.remove('actualizado'), 1000);
            }
        }
        ventasAnteriores = d.ventas_aprobadas;

    } catch (error) {
        console.error("Error actualizando dashboard", error);
    }
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

// Iniciar
checkAuth(); 
loadStats();

// ⭐ ACTUALIZAR AUTOMÁTICAMENTE CADA 10 SEGUNDOS ⭐
setInterval(loadStats, 10000); 
</script>
</body>
</html>
