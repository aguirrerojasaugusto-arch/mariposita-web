<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Dashboard · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <!-- ⭐ LOGO IDÉNTICO AL FRONTEND ⭐ -->
        <a href="/admin/dashboard.html" class="admin-logo-block">
            <img src="/admin/img/logo.png" alt="Logo" class="admin-logo-icon" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23fff\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'%23000\'>🦋</text></svg>'">
            <div class="admin-logo-text">
                <strong>MARIPOSITA</strong>
                <span>Artesanía Textil</span>
            </div>
        </a>
        
        <!-- ⭐ PERFIL DEL USUARIO LOGUEADO ⭐ -->
        <div class="user-profile">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-info">
                <strong id="user-nombre">Cargando...</strong>
                <span id="user-rol">Admin</span>
            </div>
        </div>

        <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" id="nav-sorteos">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html">🔍 Buscar Cliente</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    <main class="main">
        <h2 style="margin-bottom: 2rem;">Bienvenido, <span id="saludo-nombre"></span></h2>
        
        <div class="stats-grid" id="stats" style="margin-bottom: 2rem;"></div>

        <div class="card">
            <h3 style="color:var(--color-primario); margin-bottom:1rem;">Acciones rápidas</h3>
            <p style="display:flex; gap:1rem; flex-wrap:wrap;">
                <a href="/admin/ordenes.html" class="btn btn-primario">Revisar órdenes</a>
                <a href="/admin/tickets.html" class="btn btn-primario">Revisar tickets</a>
                <a href="/admin/buscar.html" class="btn btn-acento">🔍 Buscar Cliente</a>
            </p>
        </div>
    </main>
</div>
<script>
async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    
    // ⭐ ACTUALIZAMOS LOS DATOS DEL PERFIL EN EL SIDEBAR ⭐
    document.getElementById('user-nombre').textContent = d.nombre;
    document.getElementById('user-rol').textContent = d.rol;
    document.getElementById('user-avatar').textContent = d.nombre.charAt(0).toUpperCase(); // Primera letra del nombre
    
    // Saludo principal
    document.getElementById('saludo-nombre').textContent = d.nombre;

    // Ocultar menús según el rol
    if (d.rol !== 'admin') {
        document.getElementById('nav-productos').style.display = 'none';
        document.getElementById('nav-sorteos').style.display = 'none';
        document.getElementById('nav-carrusel').style.display = 'none';
        document.getElementById('nav-usuarios').style.display = 'none';
        document.getElementById('nav-config').style.display = 'none';
    }
}

async function loadStats() {
    const r = await fetch('/api/admin/dashboard');
    if (r.status === 401) return location.href = '/admin/login.html';
    const d = await r.json();
    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="num">${d.ordenes_pendientes}</div><div class="label">Órdenes pendientes</div></div>
        <div class="stat"><div class="num">${d.tickets_pendientes}</div><div class="label">Tickets pendientes</div></div>
        <div class="stat"><div class="num">S/ ${d.ventas_aprobadas.toFixed(2)}</div><div class="label">Ventas aprobadas</div></div>
        <div class="stat"><div class="num">${d.total_ordenes}</div><div class="label">Órdenes totales</div></div>
    `;
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

checkAuth(); loadStats();
</script>
</body>
</html>
