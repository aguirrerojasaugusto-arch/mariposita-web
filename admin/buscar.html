<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Consultar Estado · Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h1>🦋 Mariposita</h1>
        <a href="/admin/dashboard.html">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" id="nav-sorteos">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html" class="active">🔍 Consultar Estado</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    
    <main class="main">
        <div class="search-container">
            <h2 class="search-title">Consultar mi Pedido</h2>
            <p class="search-subtitle">Ingresa tu DNI o Teléfono para ver el estado de tus compras y tickets en tiempo real.</p>
            
            <div class="search-input-group">
                <input type="text" id="input-busqueda" placeholder="Ej: 74589612 o 987654321" onkeypress="if(event.key === 'Enter') buscar()">
                <button onclick="buscar()">Buscar</button>
            </div>

            <div id="resultados"></div>
        </div>
    </main>
</div>

<script>
// ⭐ FUNCIÓN PARA VERIFICAR EL ROL Y OCULTAR MENÚS ⭐
async function checkAuth() {
    try {
        const r = await fetch('/api/auth/me');
        const d = await r.json();
        
        if (!d.logged) {
            return location.href = '/admin/login.html';
        }
        
        // Si es vendedor, ocultar las opciones de administrador
        if (d.rol !== 'admin') {
            document.getElementById('nav-productos').style.display = 'none';
            document.getElementById('nav-sorteos').style.display = 'none';
            document.getElementById('nav-carrusel').style.display = 'none';
            document.getElementById('nav-usuarios').style.display = 'none';
            document.getElementById('nav-config').style.display = 'none';
        }
    } catch (e) {
        location.href = '/admin/login.html';
    }
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

async function buscar() {
    const query = document.getElementById('input-busqueda').value.trim();
    const cont = document.getElementById('resultados');

    if (!query) {
        cont.innerHTML = '<p style="color:red; font-weight:bold;">Por favor, ingresa tu DNI o Teléfono.</p>';
        return;
    }

    cont.innerHTML = '<p style="color:var(--color-primario); font-weight:bold;">Buscando en la base de datos...</p>';

    try {
        const res = await fetch(`/api/consultar?query=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data.ordenes.length && !data.tickets.length) {
            cont.innerHTML = '<div class="alert alert-info" style="background:#e3f2fd; color:#1565c0; padding:1rem; border-radius:8px;">No se encontraron compras ni tickets registrados con ese número.</div>';
            return;
        }

        let html = '';

        // Mostrar Órdenes de Ropa
        if (data.ordenes.length > 0) {
            html += '<h3 style="text-align:left; color:#333; margin: 2rem 0 1rem; border-bottom: 2px solid #eee; padding-bottom: 5px;">🛍️ Compras de Ropa</h3>';
            data.ordenes.forEach(o => {
                const estadoClass = `estado-${o.estado}`;
                html += `
                    <div class="resultado-card">
                        <div class="resultado-header">
                            <strong>Orden: ${o.codigo}</strong>
                            <span class="badge-estado ${estadoClass}">${o.estado.toUpperCase()}</span>
                        </div>
                        <p><strong>Fecha:</strong> ${o.creado_en}</p>
                        <p><strong>Monto Total:</strong> S/ ${o.total.toFixed(2)}</p>
                        <p><strong>Dirección:</strong> ${o.cliente_direccion}</p>
                        ${o.estado === 'rechazado' && o.notas_admin ? `<p style="color:red; background:#ffebee; padding:5px; border-radius:4px;"><strong>Motivo de rechazo:</strong> ${o.notas_admin}</p>` : ''}
                    </div>
                `;
            });
        }

        // Mostrar Tickets de Sorteo
        if (data.tickets.length > 0) {
            html += '<h3 style="text-align:left; color:#333; margin: 2rem 0 1rem; border-bottom: 2px solid #eee; padding-bottom: 5px;">🎟️ Tickets de Sorteo</h3>';
            data.tickets.forEach(t => {
                const estadoClass = `estado-${t.estado_pago}`;
                html += `
                    <div class="resultado-card" style="border-left-color: #ff9800;">
                        <div class="resultado-header">
                            <strong>Ticket: ${t.numero_ticket}</strong>
                            <span class="badge-estado ${estadoClass}">${t.estado_pago.toUpperCase()}</span>
                        </div>
                        <p><strong>Sorteo:</strong> ${t.sorteo_nombre}</p>
                        <p><strong>Fecha de compra:</strong> ${t.creado_en}</p>
                        ${t.estado_pago === 'rechazado' && t.notas_admin ? `<p style="color:red; background:#ffebee; padding:5px; border-radius:4px;"><strong>Motivo de rechazo:</strong> ${t.notas_admin}</p>` : ''}
                    </div>
                `;
            });
        }

        cont.innerHTML = html;

    } catch (error) {
        cont.innerHTML = '<p style="color:red; font-weight:bold;">Error al consultar. Asegúrate de que el servidor esté corriendo.</p>';
    }
}

// Ejecutar la verificación de roles al cargar la página
checkAuth();
</script>
</body>
</html>
