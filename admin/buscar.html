<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Consultar Estado · Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    .search-container {
        position: relative;
        max-width: 800px; 
        margin: 2rem auto; 
        background: rgba(255, 255, 255, 0.95);
        padding: 3rem; 
        border-radius: 12px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        max-height: 85vh;
    }
    .search-title { font-size: 2rem; color: var(--color-primario); margin-bottom: 0.5rem; font-weight: 800; text-align: center; }
    .search-subtitle { color: #555; margin-bottom: 2rem; font-size: 1rem; text-align: center; }
    
    .search-input-group {
        display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem;
        flex-shrink: 0; 
    }
    .search-input-group input {
        width: 60%; max-width: 400px; padding: 1rem; border: 2px solid #ddd;
        border-radius: 8px; font-size: 1.2rem; outline: none; transition: border 0.3s;
    }
    .search-input-group input:focus { border-color: var(--color-primario); }
    .search-input-group button {
        padding: 1rem 2rem; background: var(--color-primario); color: #fff;
        border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;
        font-weight: bold; transition: background 0.3s;
    }
    .search-input-group button:hover { background: #005f8f; }

    .btn-cerrar-form {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: #ff4d4d;
        color: white;
        border: none;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
        transition: transform 0.2s, background 0.2s;
    }
    .btn-cerrar-form:hover {
        background: #cc0000;
        transform: scale(1.1);
    }

    .resumen-cliente {
        background: linear-gradient(135deg, #0d253f 0%, #1a365d 100%);
        border-radius: 10px;
        padding: 1.2rem 1.5rem;
        margin-bottom: 1.5rem;
        display: none; 
        justify-content: space-between;
        align-items: center;
        color: #fff;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        flex-shrink: 0; 
    }
    .resumen-cliente h3 { margin: 0; font-size: 1.2rem; color: #00d2ff; }
    .resumen-cliente p { margin: 0; font-size: 0.85rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }
    .resumen-total { text-align: right; }
    .resumen-total h2 { margin: 0; font-size: 1.8rem; color: #fff; font-weight: 900; }

    #resultados {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 10px; 
        text-align: left;
    }

    #resultados::-webkit-scrollbar { width: 8px; }
    #resultados::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    #resultados::-webkit-scrollbar-thumb { background: #0077b6; border-radius: 4px; }
    #resultados::-webkit-scrollbar-thumb:hover { background: #005f8f; }

    .resultado-card {
        background: #f9f9f9; border-left: 5px solid var(--color-primario);
        padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .resultado-info { flex-grow: 1; }
    .resultado-header {
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid #ddd; padding-bottom: 0.5rem; margin-bottom: 1rem;
    }
    .badge-estado {
        padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
    }
    .estado-pendiente { background: #fff3cd; color: #856404; }
    .estado-aprobado { background: #d4edda; color: #155724; }
    .estado-rechazado { background: #f8d7da; color: #721c24; }
    .estado-enviado { background: #d1ecf1; color: #0c5460; }

    /* ⭐ ESTILOS PARA BOTONES DE ACCIÓN ⭐ */
    .acciones-ticket {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-left: 1rem;
    }
    .btn-accion {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
        display: flex;
        align-items: center;
        gap: 5px;
        justify-content: center;
    }
    .btn-editar { background: #e3f2fd; color: #1565c0; border: 1px solid #1565c0; }
    .btn-editar:hover { background: #1565c0; color: #fff; }
    .btn-eliminar { background: #ffebee; color: #c62828; border: 1px solid #c62828; }
    .btn-eliminar:hover { background: #c62828; color: #fff; }
</style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h1>🦋 Mariposita</h1>
        <a href="/admin/dashboard.html">📊 Dashboard</a>
        <a href="/admin/ordenes.html">📦 Órdenes</a>
        <a href="/admin/tickets.html">🎁 Tickets</a>
        <a href="/admin/productos.html" id="nav-productos">👗 Productos</a>
        <a href="/admin/sorteos.html" id="nav-sorteos">🎰 Sorteos</a>
        <a href="/admin/carrusel.html" id="nav-carrusel">🖼️ Carrusel</a>
        <a href="/admin/usuarios.html" id="nav-usuarios">👥 Usuarios</a>
        <a href="/admin/buscar.html" class="active">🔍 Consultar Estado</a>
        <a href="/admin/configuracion.html" id="nav-config">⚙️ Configuración</a>
        <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
    </aside>
    
    <main class="main">
        <div class="search-container">
            <button class="btn-cerrar-form" id="btn-limpiar" onclick="limpiarFormulario()" title="Cerrar y limpiar">&times;</button>

            <h2 class="search-title">Consultar mi Pedido</h2>
            <p class="search-subtitle">Ingresa tu DNI o Teléfono para ver el estado de tus compras y tickets en tiempo real.</p>
            
            <div class="search-input-group">
                <input type="text" id="input-busqueda" placeholder="Ej: 74589612 o 987654321" onkeypress="if(event.key === 'Enter') buscar()">
                <button onclick="buscar()">Buscar</button>
            </div>

            <div id="resumen-cliente-box" class="resumen-cliente">
                <div>
                    <p>Participante</p>
                    <h3 id="resumen-nombre">-</h3>
                </div>
                <div class="resumen-total">
                    <p>Total Tickets</p>
                    <h2 id="resumen-total">0</h2>
                </div>
            </div>

            <div id="resultados"></div>
        </div>
    </main>
</div>

<script>
async function checkAuth() {
    try {
        const r = await fetch('/api/auth/me');
        const d = await r.json();
        
        if (!d.logged) {
            return location.href = '/admin/login.html';
        }
        
        if (d.rol !== 'admin') {
            document.getElementById('nav-productos').style.display = 'none';
            document.getElementById('nav-sorteos').style.display = 'none';
            document.getElementById('nav-carrusel').style.display = 'none';
            document.getElementById('nav-usuarios').style.display = 'none';
            document.getElementById('nav-config').style.display = 'none';
        }
    } catch (e) {
        location.href = '/admin/login.html';
    }
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

function limpiarFormulario() {
    document.getElementById('input-busqueda').value = '';
    document.getElementById('resultados').innerHTML = '';
    document.getElementById('resumen-cliente-box').style.display = 'none';
    document.getElementById('btn-limpiar').style.display = 'none';
}

async function buscar() {
    const query = document.getElementById('input-busqueda').value.trim();
    const cont = document.getElementById('resultados');
    const resumenBox = document.getElementById('resumen-cliente-box');
    const btnLimpiar = document.getElementById('btn-limpiar');

    resumenBox.style.display = 'none';
    btnLimpiar.style.display = 'none';
    document.getElementById('resumen-nombre').textContent = '-';
    document.getElementById('resumen-total').textContent = '0';

    if (!query) {
        cont.innerHTML = '<p style="color:red; font-weight:bold; text-align:center;">Por favor, ingresa tu DNI o Teléfono.</p>';
        return;
    }

    cont.innerHTML = '<p style="color:var(--color-primario); font-weight:bold; text-align:center; margin-top:2rem;">Buscando en la base de datos...</p>';

    try {
        const res = await fetch(`/api/consultar?query=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data.ordenes.length && !data.tickets.length) {
            cont.innerHTML = '<div class="alert alert-info" style="background:#e3f2fd; color:#1565c0; padding:1rem; border-radius:8px; text-align:center;">No se encontraron compras ni tickets registrados con ese número.</div>';
            btnLimpiar.style.display = 'flex';
            return;
        }

        if (data.tickets.length > 0) {
            const primerTicket = data.tickets[0];
            document.getElementById('resumen-nombre').textContent = primerTicket.cliente_nombre;
            document.getElementById('resumen-total').textContent = data.tickets.length;
            resumenBox.style.display = 'flex'; 
        }

        let html = '';

        if (data.ordenes.length > 0) {
            html += '<h3 style="color:#333; margin: 1rem 0; border-bottom: 2px solid #eee; padding-bottom: 5px;">🛍️ Compras de Ropa</h3>';
            data.ordenes.forEach(o => {
                const estadoClass = `estado-${o.estado}`;
                html += `
                    <div class="resultado-card">
                        <div class="resultado-info">
                            <div class="resultado-header">
                                <strong>Orden: ${o.codigo}</strong>
                                <span class="badge-estado ${estadoClass}">${o.estado.toUpperCase()}</span>
                            </div>
                            <p><strong>Fecha:</strong> ${o.creado_en}</p>
                            <p><strong>Monto Total:</strong> S/ ${o.total.toFixed(2)}</p>
                            <p><strong>Dirección:</strong> ${o.cliente_direccion}</p>
                            ${o.estado === 'rechazado' && o.notas_admin ? `<p style="color:red; background:#ffebee; padding:5px; border-radius:4px;"><strong>Motivo de rechazo:</strong> ${o.notas_admin}</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        if (data.tickets.length > 0) {
            html += '<h3 style="color:#333; margin: 1.5rem 0 1rem; border-bottom: 2px solid #eee; padding-bottom: 5px;">🎟️ Tickets de Sorteo</h3>';
            data.tickets.forEach(t => {
                const estadoClass = `estado-${t.estado_pago}`;
                html += `
                    <div class="resultado-card" style="border-left-color: #ff9800;">
                        <div class="resultado-info">
                            <div class="resultado-header">
                                <strong>Ticket: ${t.numero_ticket}</strong>
                                <span class="badge-estado ${estadoClass}">${t.estado_pago.toUpperCase()}</span>
                            </div>
                            <p><strong>Sorteo:</strong> ${t.sorteo_nombre}</p>
                            <p><strong>Fecha de compra:</strong> ${t.creado_en}</p>
                            ${t.estado_pago === 'rechazado' && t.notas_admin ? `<p style="color:red; background:#ffebee; padding:5px; border-radius:4px;"><strong>Motivo de rechazo:</strong> ${t.notas_admin}</p>` : ''}
                        </div>
                        <div class="acciones-ticket">
                            <!-- ⭐ BOTONES DE EDITAR Y ELIMINAR ⭐ -->
                            <button class="btn-accion btn-editar" onclick="editarTicket('${t.id}', '${t.numero_ticket}', '${t.cliente_nombre}', '${t.cliente_dni}', '${t.cliente_telefono}', '${t.cliente_departamento}')">✏️ Editar</button>
                            <button class="btn-accion btn-eliminar" onclick="eliminarTicket('${t.id}', '${t.numero_ticket}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
            });
        }

        cont.innerHTML = html;
        cont.scrollTop = 0;
        btnLimpiar.style.display = 'flex';

    } catch (error) {
        cont.innerHTML = '<p style="color:red; font-weight:bold; text-align:center;">Error al consultar. Asegúrate de que el servidor esté corriendo.</p>';
        btnLimpiar.style.display = 'flex';
    }
}

// ⭐ FUNCIONES PARA EDITAR Y ELIMINAR ⭐
function editarTicket(id, numero, nombre, dni, telefono, departamento) {
    const nuevoNombre = prompt(`Editar nombre para el Ticket ${numero}:`, nombre);
    if (nuevoNombre === null) return; // Canceló

    const nuevoDni = prompt(`Editar DNI para el Ticket ${numero}:`, dni);
    if (nuevoDni === null) return;

    const nuevoTelefono = prompt(`Editar Teléfono para el Ticket ${numero}:`, telefono);
    if (nuevoTelefono === null) return;

    const nuevoDepartamento = prompt(`Editar Departamento para el Ticket ${numero}:`, departamento);
    if (nuevoDepartamento === null) return;

    fetch(`/api/admin/tickets/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            cliente_nombre: nuevoNombre,
            cliente_dni: nuevoDni,
            cliente_telefono: nuevoTelefono,
            cliente_departamento: nuevoDepartamento
        })
    }).then(res => {
        if (res.ok) {
            alert('✅ Ticket editado correctamente.');
            buscar(); // Recargar resultados
        } else {
            alert('❌ Error al editar el ticket.');
        }
    });
}

function eliminarTicket(id, numero) {
    if (!confirm(`⚠️ ¿Estás seguro de eliminar el Ticket ${numero}?\n\nEsta acción liberará el número en la base de datos y el cliente ya no participará.`)) return;

    fetch(`/api/admin/tickets/${id}`, {
        method: 'DELETE'
    }).then(res => {
        if (res.ok) {
            alert('✅ Ticket eliminado. El número ya está libre.');
            buscar(); // Recargar resultados
        } else {
            alert('❌ Error al eliminar el ticket.');
        }
    });
}

checkAuth();
</script>
</body>
</html>
