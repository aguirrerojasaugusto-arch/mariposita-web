<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Ganadores · Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: #fff; width: 90%; max-width: 550px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: var(--color-primario); color: #fff; }
    .modal-header h3 { margin: 0; font-size: 1.2rem; }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 1.5rem; }
    .modal-footer { padding: 1.5rem; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 1rem; background: #f9f9f9; }
    
    .form-group input, .form-group select { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #555; }
    
    /* ⭐ ESTILOS DEL BUSCADOR INTELIGENTE ⭐ */
    .buscador-container { position: relative; margin-bottom: 1.5rem; }
    .buscador-input { width: 100%; padding: 0.8rem 1rem; border: 2px solid var(--color-primario); border-radius: 8px; font-size: 1rem; outline: none; }
    .resultados-busqueda { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .item-resultado { padding: 0.8rem 1rem; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .item-resultado:hover { background: #f0f7ff; }
    .item-resultado strong { display: block; color: #333; font-size: 0.95rem; }
    .item-resultado small { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>

    <div class="admin-top-bar">
        <div class="admin-top-bar-info">
            <span>📞 95485966</span>
            <span>✉️ contacto@mariposita.pe</span>
            <span>📍 PAUCARA, ACOBAMBA</span>
        </div>
    </div>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/admin/dashboard.html" class="admin-logo-block">
                    <img src="/admin/img/logo.png" alt="Logo" class="admin-logo-icon" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23fff\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'%23000\'>🦋</text></svg>'">
                    <div class="admin-logo-text">
                        <strong>MARIPOSITA</strong>
                        <span>Artesanía Textil</span>
                    </div>
                </a>
                <div class="user-profile">
                    <div class="user-avatar" id="user-avatar">A</div>
                    <div class="user-info">
                        <strong id="user-nombre">Cargando...</strong>
                        <span id="user-rol">Admin</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html">📊 Dashboard</a>
                <a href="/admin/ordenes.html">📦 Órdenes</a>
                <a href="/admin/tickets.html">🎁 Tickets</a>
                <a href="/admin/productos.html">👗 Productos</a>
                <a href="/admin/sorteos.html">🎰 Sorteos</a>
                <a href="/admin/ganadores.html" class="active">🏆 Ganadores</a>
                <a href="/admin/carrusel.html">🖼️ Carrusel</a>
                <a href="/admin/usuarios.html">👥 Usuarios</a>
                <a href="/admin/buscar.html">🔍 Buscar Cliente</a>
                <a href="/admin/configuracion.html">⚙️ Configuración</a>
                <a href="#" class="logout" onclick="logout()">🚪 Cerrar sesión</a>
            </nav>
        </aside>
        <main class="main">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                <h2 style="margin:0;">Registro de Ganadores</h2>
                <button class="btn btn-primario" onclick="abrirModal()">+ Registrar Ganador</button>
            </div>
            <div id="lista"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-ganador">
        <div class="modal-content">
            <div class="modal-header"><h3>Registrar Nuevo Ganador</h3><button class="modal-close" onclick="cerrarModal()">✕</button></div>
            <div class="modal-body">
                
                <!-- ⭐ BUSCADOR INTELIGENTE ⭐ -->
                <div class="buscador-container">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: var(--color-primario);">
                        🔍 Buscar Cliente (DNI, Nombre, Celular o Ticket)
                    </label>
                    <input type="text" id="input-buscar-cliente" class="buscador-input" placeholder="Escribe para buscar..." autocomplete="off">
                    <div class="resultados-busqueda" id="resultados-busqueda"></div>
                </div>

                <form id="form-ganador">
                    <div class="form-group">
                        <label>Sorteo *</label>
                        <select id="g-sorteo" required></select>
                    </div>
                    <div class="form-group">
                        <label>Nombre del Ganador *</label>
                        <input type="text" id="g-nombre" required readonly style="background:#f4f4f4; cursor:not-allowed;">
                    </div>
                    <div class="form-group">
                        <label>Número de Ticket *</label>
                        <input type="text" id="g-ticket" required readonly style="background:#f4f4f4; cursor:not-allowed;">
                    </div>
                    <!-- ⭐ CAMPO DEPARTAMENTO AGREGADO ⭐ -->
                    <div class="form-group">
                        <label>Departamento</label>
                        <input type="text" id="g-departamento" readonly style="background:#f4f4f4; cursor:not-allowed;" placeholder="Se autocompleta al seleccionar cliente">
                    </div>
                    <div class="form-group">
                        <label>Premio (Opcional)</label>
                        <input type="text" id="g-premio" placeholder="Ej: Pollera Huancavelica">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" form="form-ganador" class="btn btn-primario" id="btn-guardar">Registrar</button>
            </div>
        </div>
    </div>

<script>
let sorteosList = [];
let todosLosTickets = []; // Guardaremos todos los tickets aprobados aquí

async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    document.getElementById('user-nombre').textContent = d.nombre;
    document.getElementById('user-rol').textContent = d.rol;
    document.getElementById('user-avatar').textContent = d.nombre.charAt(0).toUpperCase();
    cargar();
    cargarSorteos();
    cargarTickets();
}

async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/admin/login.html';
}

async function cargarSorteos() {
    const r = await fetch('/api/admin/sorteos');
    if (r.ok) {
        sorteosList = await r.json();
        document.getElementById('g-sorteo').innerHTML = '<option value="">Selecciona un sorteo</option>' + 
            sorteosList.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
    }
}

// ⭐ CARGAR TICKETS PARA EL BUSCADOR ⭐
async function cargarTickets() {
    const r = await fetch('/api/admin/tickets/aprobados');
    if (r.ok) todosLosTickets = await r.json();
}

async function cargar() {
    const r = await fetch('/api/admin/ganadores');
    if (r.ok) {
        const ganadores = await r.json();
        const lista = document.getElementById('lista');
        if (!ganadores.length) {
            lista.innerHTML = '<div class="alert alert-info">Aún no has registrado ningún ganador.</div>';
            return;
        }
        lista.innerHTML = `<table>
            <thead><tr><th>Fecha</th><th>Ganador</th><th>Ticket</th><th>Departamento</th><th>Sorteo</th><th>Premio</th><th>Acciones</th></tr></thead>
            <tbody>
                ${ganadores.map(g => `
                    <tr>
                        <td>${g.creado_en}</td>
                        <td><strong>${g.cliente_nombre}</strong></td>
                        <td>${g.numero_ticket}</td>
                        <td>${g.departamento || '—'}</td> <!-- ⭐ NUEVA COLUMNA -->
                        <td>${g.sorteo_nombre}</td>
                        <td>${g.premio || '—'}</td>
                        <td><button class="btn btn-rechazar" onclick="eliminar(${g.id})">Eliminar</button></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    }
}

function abrirModal() { 
    document.getElementById('form-ganador').reset(); 
    document.getElementById('input-buscar-cliente').value = '';
    document.getElementById('resultados-busqueda').style.display = 'none';
    document.getElementById('modal-ganador').classList.add('active'); 
}
function cerrarModal() { document.getElementById('modal-ganador').classList.remove('active'); }

// ⭐ LÓGICA DEL BUSCADOR INTELIGENTE ⭐
document.getElementById('input-buscar-cliente').addEventListener('input', function(e) {
    const texto = e.target.value.toLowerCase().trim();
    const contenedor = document.getElementById('resultados-busqueda');
    
    if (texto.length < 2) { contenedor.style.display = 'none'; return; }

    const filtrados = todosLosTickets.filter(t => 
        (t.cliente_nombre && t.cliente_nombre.toLowerCase().includes(texto)) ||
        (t.cliente_dni && t.cliente_dni.includes(texto)) ||
        (t.cliente_telefono && t.cliente_telefono.includes(texto)) ||
        (t.numero_ticket && t.numero_ticket.toLowerCase().includes(texto))
    ).slice(0, 5); // Mostrar solo los primeros 5 resultados

    if (filtrados.length === 0) {
        contenedor.innerHTML = '<div class="item-resultado">No se encontraron tickets.</div>';
        contenedor.style.display = 'block';
        return;
    }

    contenedor.innerHTML = filtrados.map(t => `
        <div class="item-resultado" onclick="seleccionarCliente(${t.id})">
            <strong>${t.cliente_nombre}</strong>
            <small>DNI: ${t.cliente_dni || '—'} | Tel: ${t.cliente_telefono || '—'} | Ticket: ${t.numero_ticket}</small>
        </div>
    `).join('');
    contenedor.style.display = 'block';
});

// ⭐ AUTOCOMPLETAR CAMPOS AL SELECCIONAR ⭐
function seleccionarCliente(idTicket) {
    const ticket = todosLosTickets.find(t => t.id === idTicket);
    if (!ticket) return;

    document.getElementById('g-nombre').value = ticket.cliente_nombre;
    document.getElementById('g-ticket').value = ticket.numero_ticket;
    document.getElementById('g-sorteo').value = ticket.sorteo_id;
    
    // ⭐ AUTOCOMPLETAMOS EL DEPARTAMENTO
    document.getElementById('g-departamento').value = ticket.cliente_departamento || 'No registrado';
    
    document.getElementById('resultados-busqueda').style.display = 'none';
    document.getElementById('input-buscar-cliente').value = '';
}

// Ocultar resultados si se hace clic fuera
document.addEventListener('click', function(e) {
    if (!document.querySelector('.buscador-container').contains(e.target)) {
        document.getElementById('resultados-busqueda').style.display = 'none';
    }
});

document.getElementById('form-ganador').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-guardar');
    
    if (!document.getElementById('g-nombre').value) {
        alert('Por favor, busca y selecciona un cliente primero.');
        return;
    }

    btn.disabled = true; btn.textContent = 'Registrando...';

    const data = {
        sorteo_id: document.getElementById('g-sorteo').value,
        cliente_nombre: document.getElementById('g-nombre').value,
        numero_ticket: document.getElementById('g-ticket').value,
        premio: document.getElementById('g-premio').value,
        departamento: document.getElementById('g-departamento').value // ⭐ Agregamos esto para enviarlo
    };

    try {
        const res = await fetch('/api/admin/ganadores', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            alert('✅ Ganador registrado correctamente');
            cerrarModal();
            cargar();
        } else {
            const d = await res.json();
            alert('❌ Error: ' + d.error);
        }
    } catch (err) { alert('Error de red'); } 
    finally { btn.disabled = false; btn.textContent = 'Registrar'; }
});

async function eliminar(id) {
    if (!confirm('¿Eliminar este ganador?')) return;
    await fetch(`/api/admin/ganadores/${id}`, { method: 'DELETE' });
    cargar();
}

checkAuth();
</script>
</body>
</html>
