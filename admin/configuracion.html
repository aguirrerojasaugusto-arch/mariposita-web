<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Configuración · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div class="config-modal">
    <div class="config-header">
        <h2>⚙️ Configuración General</h2>
        <button class="btn-cerrar" onclick="window.location.href='/admin/dashboard.html'">✕</button>
    </div>
    
    <div class="config-body">
        
        <div class="config-section">
            <h3>Diseño del Panel y Tienda</h3>
            <div class="image-grid">
                <div class="image-box">
                    <h4>Logo del Sistema</h4>
                    <div id="preview-logo" class="preview-box logo"><span style="color:#999;">Sin Logo</span></div>
                    <form id="form-logo" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="logo">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Logo</button>
                    </form>
                </div>
                <div class="image-box">
                    <h4>Imagen de Fondo (Login)</h4>
                    <div id="preview-fondo" class="preview-box"><span style="color:#999;">Sin Fondo</span></div>
                    <form id="form-fondo" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="fondo">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Fondo</button>
                    </form>
                </div>
                <div class="image-box">
                    <h4>Flyer de Inicio (Emergente)</h4>
                    <div id="preview-flyer" class="preview-box"><span style="color:#999;">Sin Flyer</span></div>
                    <form id="form-flyer" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="flyer">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Flyer</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="config-section">
            <h3>Datos de Pago y Contacto</h3>
            <form id="form-config">
                <div class="form-group"><label>Número Yape</label><input name="numero_yape"></div>
                <div class="form-group"><label>Número Plin</label><input name="numero_plin"></div>
                <div class="form-group"><label>Nombre del titular</label><input name="nombre_titular"></div>
                <div class="form-group"><label>WhatsApp (Enlace flotante)</label><input name="whatsapp"></div>
                <div class="form-group"><label>Email de contacto</label><input name="email_contacto"></div>
                <div class="form-group"><label>Teléfono (Barra superior)</label><input name="telefono_contacto" placeholder="Ej: (0125) 456 78 90"></div>
                <div class="form-group"><label>Ubicación (Barra superior)</label><input name="ubicacion" placeholder="Ej: Huancavelica, Perú"></div>

                <!-- ⭐ NUEVOS CAMPOS REDES SOCIALES ⭐ -->
                <div class="form-group"><label>URL Facebook</label><input name="facebook_url" placeholder="https://facebook.com/tu-pagina"></div>
                <div class="form-group"><label>URL TikTok</label><input name="tiktok_url" placeholder="https://tiktok.com/@tu-cuenta"></div>
                <div class="form-group"><label>URL YouTube</label><input name="youtube_url" placeholder="https://youtube.com/@tu-canal"></div>

                <button type="submit" class="btn btn-primario" style="width:100%; padding:0.8rem; margin-top:1rem;">Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>

<script>
async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    if (d.rol !== 'admin') {
        alert('Solo administradores pueden acceder a configuración.');
        location.href = '/admin/dashboard.html';
    }
    cargar();
}

async function cargar() {
    const r = await fetch('/api/admin/configuracion');
    if (r.status === 401) return location.href = '/admin/login.html';
    const cfg = await r.json();
    
    const f = document.getElementById('form-config');
    Object.entries(cfg).forEach(([k, v]) => { if (f[k]) f[k].value = v; });

    if (cfg.logo_admin) document.getElementById('preview-logo').innerHTML = `<img src="${cfg.logo_admin}">`;
    if (cfg.fondo_login) {
        const preview = document.getElementById('preview-fondo');
        preview.style.backgroundImage = `url('${cfg.fondo_login}')`;
        preview.innerHTML = '';
    }
    if (cfg.flyer_inicio) {
        const preview = document.getElementById('preview-flyer');
        preview.style.backgroundImage = `url('${cfg.flyer_inicio}')`;
        preview.innerHTML = '';
    }
}

document.getElementById('form-config').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const r = await fetch('/api/admin/configuracion', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(fd))
    });
    if (r.ok) alert('Datos guardados correctamente'); else alert('Error al guardar');
});

function configurarSubida(idForm) {
    document.getElementById(idForm).addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const textoOriginal = btn.textContent;
        btn.disabled = true; btn.textContent = 'Subiendo...';
        const fd = new FormData(e.target);
        try {
            const r = await fetch('/api/admin/configuracion-imagenes', { method: 'POST', body: fd });
            const d = await r.json();
            if (r.ok) { alert('Imagen actualizada correctamente'); e.target.reset(); cargar(); } 
            else { alert('Error: ' + d.error); }
        } catch (err) { alert('Error de red'); }
        btn.disabled = false; btn.textContent = textoOriginal;
    });
}

configurarSubida('form-logo');
configurarSubida('form-fondo');
configurarSubida('form-flyer');
checkAuth();
</script>
</body>
</html>
