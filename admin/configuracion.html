<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Configuración · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
    body { background: linear-gradient(135deg, #0b1b2b 0%, #1a3a5a 100%); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .config-modal { background: #ffffff; width: 95%; max-width: 1000px; max-height: 90vh; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .config-header { padding: 1.5rem 2rem; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .config-header h2 { margin: 0; color: var(--color-primario, #0077b6); font-size: 1.5rem; }
    .config-header .btn-cerrar { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #888; transition: color 0.3s; }
    .config-header .btn-cerrar:hover { color: #c62828; }
    .config-body { padding: 2rem; overflow-y: auto; flex-grow: 1; }
    .config-section { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #eee; }
    .config-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .config-section h3 { color: var(--color-primario, #0077b6); margin-bottom: 1rem; font-size: 1.1rem; }
    
    /* ⭐ GRID DE IMÁGENES CORREGIDO ⭐ */
    .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem; }
    .image-box { display: flex; flex-direction: column; background: #f9f9f9; border: 1px solid #eee; border-radius: 12px; padding: 1.5rem; }
    .image-box h4 { margin-bottom: 1rem; color: #333; font-size: 1rem; text-align: center; }
    
    .preview-box { width: 100%; height: 160px; border: 2px dashed #ccc; border-radius: 8px; display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem; overflow: hidden; background: #fff; background-size: cover; background-position: center; }
    .preview-box.logo { border-radius: 50%; width: 160px; height: 160px; margin: 0 auto 1.5rem auto; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
    
    /* ⭐ NUEVO DISEÑO PARA LOS INPUTS DE ARCHIVO Y BOTONES ⭐ */
    .file-input-group { display: flex; flex-direction: column; gap: 0.8rem; margin-top: auto; }
    .file-input-group input[type="file"] { 
        width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; 
        font-size: 0.85rem; background: #fff; cursor: pointer;
    }
    .file-input-group input[type="file"]::file-selector-button {
        background: #e3f2fd; color: #1565c0; border: none; padding: 0.4rem 0.8rem;
        border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 10px;
        transition: background 0.3s;
    }
    .file-input-group input[type="file"]::file-selector-button:hover { background: #bbdefb; }
    .file-input-group button { width: 100%; padding: 0.7rem; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #555; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.8rem; border: 1px solid #e1e4e8; border-radius: 8px; background: #f5f7fa; transition: all 0.3s; }
    .form-group input:focus { background: #fff; border-color: var(--color-primario, #0077b6); outline: none; }
</style>
</head>
<body>

<div class="config-modal">
    <div class="config-header">
        <h2>⚙️ Configuración General</h2>
        <button class="btn-cerrar" onclick="window.location.href='/admin/dashboard.html'">✕</button>
    </div>
    
    <div class="config-body">
        
        <div class="config-section">
            <h3>Diseño del Panel y Tienda</h3>
            <div class="image-grid">
                
                <!-- LOGO -->
                <div class="image-box">
                    <h4>Logo del Sistema</h4>
                    <div id="preview-logo" class="preview-box logo">
                        <span style="color:#999;">Sin Logo</span>
                    </div>
                    <form id="form-logo" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="logo">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Logo</button>
                    </form>
                </div>

                <!-- FONDO -->
                <div class="image-box">
                    <h4>Imagen de Fondo (Login)</h4>
                    <div id="preview-fondo" class="preview-box">
                        <span style="color:#999;">Sin Fondo</span>
                    </div>
                    <form id="form-fondo" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="fondo">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Fondo</button>
                    </form>
                </div>

                <!-- FLYER -->
                <div class="image-box">
                    <h4>Flyer de Inicio (Emergente)</h4>
                    <div id="preview-flyer" class="preview-box"><span style="color:#999;">Sin Flyer</span></div>
                    <form id="form-flyer" enctype="multipart/form-data" class="file-input-group">
                        <input type="hidden" name="tipo" value="flyer">
                        <input type="file" name="imagen" accept="image/*" required>
                        <button type="submit" class="btn btn-primario">Subir Flyer</button>
                    </form>
                </div>

            </div>
        </div>

        <div class="config-section">
            <h3>Datos de Pago y Contacto</h3>
            <form id="form-config">
                <div class="form-group"><label>Número Yape</label><input name="numero_yape"></div>
                <div class="form-group"><label>Número Plin</label><input name="numero_plin"></div>
                <div class="form-group"><label>Nombre del titular</label><input name="nombre_titular"></div>
                <div class="form-group"><label>WhatsApp (Enlace flotante)</label><input name="whatsapp"></div>
                <div class="form-group"><label>Email de contacto</label><input name="email_contacto"></div>
                
                <div class="form-group"><label>Teléfono (Barra superior)</label><input name="telefono_contacto" placeholder="Ej: (0125) 456 78 90"></div>
                <div class="form-group"><label>Ubicación (Barra superior)</label><input name="ubicacion" placeholder="Ej: Huancavelica, Perú"></div>

                <button type="submit" class="btn btn-primario" style="width:100%; padding:1rem; margin-top:1rem; font-size: 1.1rem;">Guardar Datos de Contacto</button>
            </form>
        </div>

    </div>
</div>

<script>
async function checkAuth() {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.logged) return location.href = '/admin/login.html';
    
    if (d.rol !== 'admin') {
        alert('Solo administradores pueden acceder a configuración.');
        location.href = '/admin/dashboard.html';
    }
    cargar();
}

async function cargar() {
    const r = await fetch('/api/admin/configuracion');
    if (r.status === 401) return location.href = '/admin/login.html';
    const cfg = await r.json();
    
    const f = document.getElementById('form-config');
    Object.entries(cfg).forEach(([k, v]) => { if (f[k]) f[k].value = v; });

    if (cfg.logo_admin) {
        document.getElementById('preview-logo').innerHTML = `<img src="${cfg.logo_admin}">`;
    }
    if (cfg.fondo_login) {
        const preview = document.getElementById('preview-fondo');
        preview.style.backgroundImage = `url('${cfg.fondo_login}')`;
        preview.innerHTML = '';
    }
    if (cfg.flyer_inicio) {
        const preview = document.getElementById('preview-flyer');
        preview.style.backgroundImage = `url('${cfg.flyer_inicio}')`;
        preview.innerHTML = '';
    }
}

document.getElementById('form-config').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const r = await fetch('/api/admin/configuracion', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(fd))
    });
    if (r.ok) alert('Datos guardados correctamente'); else alert('Error al guardar');
});

// Subida de imágenes genérica
function configurarSubida(idForm) {
    document.getElementById(idForm).addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const textoOriginal = btn.textContent;
        
        btn.disabled = true; 
        btn.textContent = 'Subiendo...';
        
        const fd = new FormData(e.target);
        try {
            const r = await fetch('/api/admin/configuracion-imagenes', { method: 'POST', body: fd });
            const d = await r.json();
            if (r.ok) { 
                alert('Imagen actualizada correctamente'); 
                e.target.reset(); // Limpiar el input file
                cargar(); 
            } 
            else { alert('Error: ' + d.error); }
        } catch (err) { alert('Error de red'); }
        
        btn.disabled = false; 
        btn.textContent = textoOriginal;
    });
}

configurarSubida('form-logo');
configurarSubida('form-fondo');
configurarSubida('form-flyer'); 

checkAuth();
</script>
</body>
</html>
